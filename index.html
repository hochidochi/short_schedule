<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애니메이션 오픈 일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --page:#F1F2EE; --surface:#FFFFFF; --ink:#16191D; --ink2:#474C53; --muted:#868B91;
  --line:#E1E3DD; --line2:#C9CCC5;
  --launch:#1E48C8; --serial:#D7E0FA; --serial-ink:#1E3A8A; --prod:#E7E8E2;
  --warn:#B97C06; --warn-bg:#FCEFCF; --bad:#C4362E; --bad-bg:#FBE2DF; --good:#1F7A50; --good-bg:#DDF0E5;
  --ai:#5B45D6; --ai-bg:#E9E5FB; --now:#F2C230;
  /* 제작 라인: 내부 = 하늘색, 외부 = 주황 (같은 명도·채도 톤) */
  --int:#2B8FCC; --int-bg:#D6ECF8; --int-ink:#135B85; --int-prod:#E6F2F9;
  /* 휴재: 벽돌 붉은색 */
  --hia:#A8432C; --hia-bg:#E9C1B4; --hia-ink:#6E2718;
  --ext:#E07A2E; --ext-bg:#FBE3CF; --ext-ink:#8E4616; --ext-prod:#FBEEE3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-size:14px;line-height:1.5;
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--launch);outline-offset:1px}
[hidden]{display:none!important}

/* 상단 */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top-in{max-width:1680px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px}
.brand{padding-bottom:10px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-right:auto}
.tabs button{border:0;background:none;padding:10px 14px 11px;font-size:14px;font-weight:600;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sync{font-size:12px;padding:4px 10px;border-radius:6px;margin-bottom:10px;background:var(--page);color:var(--ink2)}
.sync[data-s="on"]{background:var(--good-bg);color:var(--good)}
.sync[data-s="off"],.sync[data-s="busy"]{background:var(--warn-bg);color:var(--warn)}
.sync[data-s="err"]{background:var(--bad-bg);color:var(--bad)}

main{max-width:1680px;margin:0 auto;padding:20px 20px 80px}
h2{font-size:15px;font-weight:700;margin:28px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
.hint{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.vo{font-size:11px;font-weight:600;padding:0 6px;border-radius:4px}
.vo.human{background:var(--good-bg);color:var(--good)}
.vo.ai{background:var(--ai-bg);color:var(--ai)}

/* ── 오픈 일정 (리더용) ── */
.lead{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;line-height:1.4}
.lead-sub{font-size:13px;color:var(--ink2);margin:0}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mon{flex:none;min-width:190px;max-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mon .ml{font-size:12px;color:var(--muted)}
.mon .mn{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.03em;color:var(--launch)}
.mon .mn small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:4px;letter-spacing:0}
.mon ul{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
.mon li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-top:1px solid var(--line)}
.mon li span:last-child{color:var(--muted)}
.mon li.late span:last-child{color:var(--bad);font-weight:600}

.calwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:78vh}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px}
table.cal th,table.cal td{padding:0}
table.cal thead th{position:sticky;top:0;z-index:5;background:var(--surface)}
table.cal thead tr:nth-child(2) th{top:24px}
.cal .yr{height:24px;font-size:12px;font-weight:700;text-align:left;padding-left:8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line2)}
.cal .mh{height:26px;width:62px;min-width:62px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line2);border-left:1px solid var(--line)}
.cal .mh.now{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--now)}
.cal .rl{position:sticky;left:0;z-index:4;background:var(--surface);min-width:230px;max-width:230px;text-align:left;
  padding:6px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);font-weight:400}
thead .rl{z-index:7}
.cal .rl .nm{border:0;background:none;padding:0;font-weight:700;font-size:13px;cursor:pointer;text-align:left;
  display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .rl .nm:hover{text-decoration:underline}
.cal .rl .mt{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:11.5px;color:var(--muted)}
.cal td.c{height:44px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;vertical-align:middle;position:relative}
.cal td.c.now{box-shadow:inset 1px 0 0 var(--now),inset -1px 0 0 var(--now)}
.cal td.prod{background:repeating-linear-gradient(135deg,var(--lp,var(--prod)) 0 5px,#F7F7F4 5px 10px)}
tr.ln-int{--lc:var(--int);--ls:var(--int-bg);--li:var(--int-ink);--lp:var(--int-prod)}
tr.ln-ext{--lc:var(--ext);--ls:var(--ext-bg);--li:var(--ext-ink);--lp:var(--ext-prod)}
tr.ln-int .rl,tr.ln-ext .rl{box-shadow:inset 4px 0 0 var(--lc)}
.ln{display:inline-block;font-size:10.5px;font-weight:700;padding:0 5px;border-radius:4px;white-space:nowrap}
.ln.int{background:var(--int-bg);color:var(--int-ink)}
.ln.ext{background:var(--ext-bg);color:var(--ext-ink)}
.lnd{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;flex:none;vertical-align:0}
.lnd.int{background:var(--int)} .lnd.ext{background:var(--ext)}
.cal td.serial{background:var(--ls,var(--serial));color:var(--li,var(--serial-ink));font-weight:600}
.cal td.launch{background:var(--lc,var(--launch));color:#fff;font-weight:700;line-height:1.15}
.cal td.launch small,.cal td.serial small,.cal td.end small{display:block;font-size:10.5px;font-weight:500;opacity:.85}
.cal td.end{background:var(--ls,var(--serial));color:var(--li,var(--serial-ink));font-weight:700}
.cal tr.sum td.c{height:34px;font-size:15px;font-weight:700;background:var(--surface)}
.cal tr.sum td.c.z{color:var(--line2);font-weight:400;font-size:12px}
.cal tr.sum .rl{font-size:12px;color:var(--ink2);font-weight:600}
.cal tr.sum.first td,.cal tr.sum.first th{border-top:0}
.cal tr.sum.last td,.cal tr.sum.last th{border-bottom:1px solid var(--line2)}
.cal tr.sum td.hot{color:var(--launch)}
.calwrap.fit{overflow-x:auto}
table.cal.fit{width:100%;min-width:1880px;table-layout:fixed}
table.cal.fit col.rlc{width:224px}
.cal .rl .mt{white-space:nowrap}
.cal .rl .mt .vo{flex:none}
table.cal.fit .rl{min-width:0;max-width:none}
table.cal.fit .mh{width:auto;min-width:0;font-size:11.5px}
table.cal.fit td.launch{font-size:12px}
.cal .y1{border-left:2px solid var(--line2)!important}
.cal td.gap{box-shadow:inset 0 -4px 0 var(--hia)}
.cal td.gaponly{background:var(--hia-bg);color:var(--hia-ink);font-weight:700;font-size:11px}
table.std.cmp{max-width:none;background:var(--surface)}
table.std.cmp td{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;border-left:1px solid var(--line2);background:none;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.cal tr.sum td.low{background:var(--bad-bg);color:var(--bad)!important}
.staff .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600}
.staff ol{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.staff li{display:grid;grid-template-columns:24px minmax(120px,170px) 1fr auto;grid-template-areas:"rk nm st mv" ". nt nt nt";gap:2px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.staff li .rk{grid-area:rk} .staff li b{grid-area:nm} .staff li .st{grid-area:st} .staff li .mv{grid-area:mv;display:flex;gap:4px} .staff li .hint{grid-area:nt;font-size:11.5px}
.staff li.off{color:var(--muted)}
.staff li.off b{color:var(--ink2)}
.staff .rk{width:20px;height:20px;border-radius:50%;background:var(--page);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.staff li.on .rk{background:var(--int);color:#fff}
.staff .q:disabled{opacity:.3;cursor:default}
.tag.tbd{background:var(--warn-bg);color:var(--warn)}
.tag.pzt{background:#E4E5E1;color:var(--ink2)}
.cal td.pz{background:repeating-linear-gradient(135deg,#E1E2DD 0 4px,#EEEFEB 4px 8px);color:var(--ink2);font-size:11px;font-weight:700}
.pzbar{margin:14px 0 0;padding:9px 12px;border-radius:8px;background:#ECEDE9;border-left:4px solid var(--ink2);font-size:13px}
td.pzc{box-shadow:inset 0 3px 0 var(--ink2)}
.pzl{display:block;font-size:10px;font-weight:700;color:var(--ink2);padding:4px 22px 0 7px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;
  font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(720px,92vw)}
.cal tr.flash th.rl{background:#FFF6D6}
.cal tr.flash td.c{outline:0}
.cal tr.held th.rl{opacity:.85}
.epb{display:block;margin:2px auto 0;border:1px solid var(--line2);background:var(--surface);border-radius:4px;font-size:10px;font-weight:600;padding:0 5px;cursor:pointer;color:var(--ink2)}
td.ep .epb{opacity:.45} tr:hover td.ep .epb,td.ep .epb:focus-visible{opacity:1}
.epb:hover{border-color:var(--ink)}
.epz{display:block;font-size:9.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
tr.pzrow td{background:repeating-linear-gradient(135deg,#E1E2DD 0 5px,#EEEFEB 5px 10px);padding:10px 12px}
.pzl2{font-weight:700;color:var(--ink2);font-size:13px}
.vo.ai{background:var(--ai-bg);color:var(--ai)}
.cal td.cont{background:repeating-linear-gradient(90deg,var(--ls,var(--serial)) 0 3px,transparent 3px 7px);opacity:.8}
.cal td.wait{background:#EFEFEC}
.seg.sm button{padding:2px 9px;font-size:12px}
.epadd{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.epadd .sp{flex:1}
.epadd .btn:disabled{opacity:.4;cursor:default}
.age{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin-left:6px;border-radius:9px;
  font-size:10px;font-weight:800;color:#fff;vertical-align:1px;letter-spacing:-.02em;line-height:1}
.age.aall{background:#2E9B4E} .age.a12{background:#2F6FD0} .age.a15{background:#E0A11B} .age.a18{background:#D23A2F}
.wlist button.wi[aria-current="true"] .age{box-shadow:0 0 0 1.5px #fff}
body.locked main,body.locked .tabs{visibility:hidden}
.gate{position:fixed;inset:0;z-index:90;background:rgba(241,242,238,.96);display:flex;align-items:center;justify-content:center;padding:20px}
.gcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:0 20px 50px rgba(20,24,30,.12)}
.gt{margin:0 0 4px;font-size:18px}
.gs,.gm{font-size:13px;color:var(--ink2);margin:0 0 16px;line-height:1.6}
.gtabs{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-bottom:14px}
.gtabs button{flex:1;border:0;background:none;padding:8px;font-size:13px;cursor:pointer;color:var(--ink2)}
.gtabs button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.gf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);margin-bottom:10px}
.gf .in{min-height:36px;font-size:14px}
.gerr{min-height:18px;font-size:12.5px;color:var(--bad);margin:2px 0 10px}
.gacts{display:flex;gap:8px;flex-wrap:wrap}
.who{font-size:12px;color:var(--ink2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.simopt{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-end;padding:10px 14px}
.simopt label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.simopt .in{min-height:26px;padding:2px 6px;font-size:12.5px}
.simopt .sog{width:100%;font-size:11.5px;font-weight:700;color:var(--ink2);margin:4px 0 -2px;padding-top:6px;border-top:1px solid var(--line)}
.simopt .sog:first-child{border-top:0;padding-top:0;margin-top:0}
.simopt label.hl{color:var(--launch);font-weight:700}
.simopt label.hl .in{border-color:var(--launch)}
.dvi{font-size:12px;font-weight:600;color:var(--ink2);margin-left:2px}
.dv{display:block;font-size:9.5px;font-weight:700;color:var(--ink2);line-height:1}
.simv{margin:14px 0 0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--launch);border-radius:10px;font-size:15px}
.simv .hint{font-size:12.5px;margin-top:3px}
.cal td.srest{background:repeating-linear-gradient(90deg,#E9EAE5 0 3px,#F6F6F3 3px 6px);color:var(--muted);font-size:9.5px;line-height:1.1}
table.simt tr.off td{opacity:.45}
table.simt td{white-space:nowrap}
.simopt .sog{width:100%;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:-4px}
.simopt label.cb{justify-content:flex-end}
.simopt label.cb span{display:flex;gap:6px;align-items:center;color:var(--ink2);font-size:12.5px;min-height:30px}
.cal tr.needrow th.rl{background:#FFF8EC}
table.eg thead th.lenh,table.eg td.lenc{min-width:58px;background:#FBFBF9}
.lenin{width:52px;border:1px solid transparent;border-radius:5px;background:transparent;font:inherit;font-size:12.5px;font-weight:600;padding:4px 5px;text-align:center}
.lenin:hover{border-color:var(--line2)} .lenin:focus{border-color:var(--launch);background:#fff;outline:0}
.lenin::placeholder{color:var(--line2);font-weight:400}
.spdbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
table.spdsum tr{cursor:pointer} table.spdsum tr:hover td{background:#F7F8F5}
table.spdsum tr.on td{background:var(--serial);font-weight:600}
#langSw{margin-bottom:10px}
#txSw{margin-bottom:10px;padding:3px 10px;font-size:12px}
#txSw[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);background:var(--ai-bg)}
[data-tx].txd::after{content:attr(data-txl);margin-left:5px;font-size:9.5px;font-weight:700;color:var(--ai);background:var(--ai-bg);border-radius:3px;padding:0 4px;vertical-align:1px;white-space:nowrap;font-style:normal}
.vev [data-tx].txd::after{display:none}
#langSw button{padding:3px 10px;font-size:12px}
.card.today{margin-bottom:14px;padding:12px 16px}
.tdtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.tdtop .sp{flex:1}
.tdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px 16px;margin-top:8px}
.tdh{font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;display:inline-block;margin-bottom:4px}
.tdh.due{background:var(--serial);color:var(--serial-ink)} .tdh.doing{background:var(--good-bg);color:var(--good)} .tdh.late{background:var(--bad-bg);color:var(--bad)}
.today ul{list-style:none;margin:0;padding:0}
.today li{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:4px 0}
.tdgo{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;padding:2px 0;font-size:13px;line-height:1.35}
.tdgo:hover b{text-decoration:underline}
.tdgo .hint{display:block;font-size:11.5px}
.tdep{font-size:11.5px;font-weight:700;color:var(--ink2)} .tdst{font-size:12.5px;font-weight:600;color:var(--launch)}
.tdok{padding:2px 8px;font-size:12px;flex:none}
.cl.flashc{animation:flashc 2.2s ease}
@keyframes flashc{0%,60%{box-shadow:inset 0 0 0 3px var(--now);background:#FFF6D6}100%{}}
.vpipe{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;margin:10px 0}
.vflow{display:flex;flex:1;min-width:640px}
.vstep{position:relative;flex:1;display:flex;align-items:center;gap:6px;border:0;background:#E9EBE6;color:var(--ink2);padding:8px 10px 8px 22px;cursor:pointer;text-align:left;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);margin-left:-8px;min-width:0}
.vstep:first-child{margin-left:0;padding-left:12px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:8px 0 0 8px}
.vstep:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%);border-radius:0 8px 8px 0}
.vstep .vno{flex:none;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--ink2);font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.vstep .vtx{display:flex;flex-direction:column;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vstep .vtx b{font-size:16px;color:var(--ink)}
.vstep:not(.z){background:#D9E3F7} .vstep:not(.z) .vno{background:var(--launch);color:#fff}
.vstep.z{opacity:.6} .vstep.on{background:var(--launch);color:#fff} .vstep.on .vtx b{color:#fff} .vstep.on .vno{background:#fff;color:var(--launch)}
.vstep:hover{filter:brightness(.97)}
.vside{display:flex;gap:6px;align-items:stretch;padding-left:14px;border-left:2px dashed var(--line2)}
.vsl{font-size:11px;color:var(--muted);writing-mode:vertical-rl;letter-spacing:.1em;align-self:center}
.vsbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;border:1px dashed var(--line2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--ink2);cursor:pointer}
.vsbtn b{font-size:16px;color:var(--ink)} .vsbtn.z{opacity:.55} .vsbtn.on{background:var(--ink);color:#fff;border-style:solid} .vsbtn.on b{color:#fff}
.vsbtn.no:not(.z) b{color:var(--bad)}
.vps{display:flex;flex-direction:column;align-items:flex-start;min-width:88px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left}

function processV2Patches(w,withB1){
  const ps=[];
  Object.keys(w.ov||{}).forEach(kk=>{ if(OLD_KEYS.includes(kk.split(":")[1])) ps.push({p:["ov",kk],del:true}); });
  const t=B1_TIMELINE.works.find(x=>x.n===w.n);
  if(t&&withB1){
    for(let k=1;k<=t.eps;k++) Object.entries(B1_TIMELINE.perEp).forEach(([sk,o])=>ps.push({p:["ov",`${k}:${sk}`],v:clone(o)}));
    Object.entries(B1_TIMELINE.batch).forEach(([sk,o])=>ps.push({p:["ov",`1:${sk}`],v:clone(o)}));
    Object.entries(B1_TIMELINE.work).forEach(([sk,o])=>ps.push({p:["ov",`w:${sk}`],v:clone(o)}));
  }
  const memo=SHEET_MEMO[w.n]||{};
  Object.entries(memo).forEach(([sk,m])=>{
    const isW=["contract","ratingFb","casting"].includes(sk);
    if(isW){ const kk=`w:${sk}`, cur=ps.filter(p=>p.p[1]===kk&&!p.del).pop();
      if(cur) cur.v.m=`${m} · ${cur.v.m}`; else ps.push({p:["ov",kk],v:{...((w.ov||{})[kk]||{}),m}}); }
    else{ const kk=`${(+w.done||0)+1}:${sk}`;   // 진행 중인 회차에 메모
      const target=t?`1:${sk}`:kk, cur=ps.filter(p=>p.p[1]===target&&!p.del).pop();
      if(cur) cur.v.m=`${m} · ${cur.v.m}`; else ps.push({p:["ov",target],v:{...((w.ov||{})[target]||{}),m}}); }
  });
  return ps;
}

  MIGRATING=true; MIG={dirty:new Set(),del:new Set(),conf:false};
  try{ runMigrations0(); } finally{ MIGRATING=false; }
  const M=MIG; MIG=null;
  render();
  if(SB.on&&(M.dirty.size||M.del.size||M.conf)){
    setSync("busy","데이터 정리해서 저장 중…");
    // 다른 사람이 먼저 같은 정리를 끝냈으면 덮어쓰지 않고 그 결과를 불러옴
    const rc=await sb("GET",T_CONF,"?id=eq.default&select=data");
    const rm=rc&&rc.length&&rc[0].data&&Array.isArray(rc[0].data.migr)?rc[0].data.migr:[];
    if(CONF.migr.every(x=>rm.includes(x))){ await pullAll(true); render(); return; }
    const now=new Date().toISOString(), ids=new Set(WORKS.map(w=>w.id));
    for(const id of M.del) if(!ids.has(id)&&REMOTE_IDS.has(id)) await sb("DELETE",T_WORKS,`?id=eq.${encodeURIComponent(id)}`);
    const rows=WORKS.filter(w=>M.dirty.has(w.id)).map(w=>({id:w.id,pos:w.pos||0,data:w,updated_at:now}));
    if(rows.length) await sb("POST",T_WORKS,"",rows,"resolution=merge-duplicates");
    await sb("POST",T_CONF,"",[{id:"default",data:CONF,updated_at:now}],"resolution=merge-duplicates");
    rows.forEach(r=>SEEN[r.id]=now); CONF_SEEN=now;
  }
  render();
}

function planCoverage(){

  const items=base.map(w=>({w,lmin:lminOf(w),dur:serialDays(w)})).map(i=>({...i,L:i.lmin}));
  if(items.length<2) return {changes:[],added:[],removed:[],gaps:[],S0:null};

  const END=D(PLAN_END), today=monOnOrAfter(addDays(TODAY,1));

  });

}

/* ======================= 자동 번역 (사람이 직접 쓴 글) =======================

const TX_URL=(q,tl)=>`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(q)}`;

function txNeed(s,tl){ if(!s||!s.trim()) return false;

function txPump(){

function forced(S,F){

  while(S.eps.slice(1,K+1).some(e=>e.need>L)) L=addDays(L,7);

    if(gap&&!first) first={k,slot};
    if(!first) run=k;
    hiatus+=gap; op.push({open:o,slot,gap}); prev=o;
  }
  return {L,ok:key(L)===key(F),op,hiatus,first,run,end:op[S.N].open};
}

let TODAY_MORE=false, FOCUS=null;
function todayItems(){
  const t=TODAY, out=[];
  WORKS.forEach(w=>{ const S=schedule(w), N=S.held?(S.N0||0):S.N, seen=new Set();
    for(let k=1;k<=N;k++){ const E=S.eps[k]; if(!E) continue;
      S.ST.forEach(s=>{ const c=E.cells[s.k]; if(!c||c.skip||isOk(c)||s.k==="contract") return;
        const kk=ovKey(c,s,k); if(seen.has(kk)) return; seen.add(kk);
        const st=c.s||c.e, e=c.e;
        const g=key(e)===key(t)?"due":e<t?"late":(st<=t&&t<=e?"doing":null);
        if(!g) return;

  });
  const ord={late:0,due:1,doing:2};

/* 제작 일정 작품 목록: 드래그로 순서 바꾸기 (pos 저장 → 모두에게 공유) */
function reorderWorks(fromId,toId,after){
  const from=WORKS.findIndex(w=>w.id===fromId); if(from<0||fromId===toId) return;
  const [m]=WORKS.splice(from,1);
  let to=WORKS.findIndex(w=>w.id===toId); if(to<0){ WORKS.splice(from,0,m); return; }
  if(after) to++;
  WORKS.splice(to,0,m);
  let n=0;
  WORKS.forEach((w,i)=>{ const p=i+1; if(w.pos===p) return; w.pos=p; n++;
    if(SB.on){ (PENDING[w.id]=PENDING[w.id]||[]).push({p:["pos"],v:p});
      clearTimeout(TIMERS[w.id]); TIMERS[w.id]=setTimeout(()=>pushWork(w.id),500); } });
  if(n&&SB.on) setSync("busy","저장 대기…");
  render();
}
function bindWorkDrag(){
  const nav=document.querySelector("#v-prod .wlist"); if(!nav) return;
  const items=[...nav.querySelectorAll(".wi")];
  const clear=()=>items.forEach(b=>b.classList.remove("drop-before","drop-after"));
  const horiz=()=>getComputedStyle(nav).display==="flex";   // 좁은 화면에선 가로 목록
  const isAfter=(b,e)=>{ const r=b.getBoundingClientRect();
    return horiz()?e.clientX>r.left+r.width/2:e.clientY>r.top+r.height/2; };
  items.forEach(b=>{
    b.draggable=true; b.title="드래그해서 순서 바꾸기 (Alt+↑↓)";
    b.addEventListener("dragstart",e=>{ DRAGGING=b.dataset.w; b.classList.add("dragging");
      e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",DRAGGING); });
    b.addEventListener("dragend",()=>{ DRAGGING=null; b.classList.remove("dragging"); clear();
      if(DEFER){ DEFER=false; render(); } });
    b.addEventListener("dragover",e=>{ if(!DRAGGING||b.dataset.w===DRAGGING) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move"; clear();
      b.classList.add(isAfter(b,e)?"drop-after":"drop-before"); });
    b.addEventListener("dragleave",()=>b.classList.remove("drop-before","drop-after"));
    b.addEventListener("drop",e=>{ e.preventDefault(); const id=DRAGGING, after=isAfter(b,e);
      clear(); DRAGGING=null; if(id) reorderWorks(id,b.dataset.w,after); });
    b.addEventListener("keydown",e=>{   // 키보드: Alt+↑/↓
      if(!e.altKey||!["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) return; e.preventDefault();
      const up=e.key==="ArrowUp"||e.key==="ArrowLeft", i=WORKS.findIndex(w=>w.id===b.dataset.w), j=i+(up?-1:1);
      if(j<0||j>=WORKS.length) return;
      reorderWorks(b.dataset.w,WORKS[j].id,!up);
      const nb=document.querySelector(`#v-prod .wi[data-w="${b.dataset.w}"]`); nb&&nb.focus(); });
  });
}
/* ======================= 일정 복사 · 붙여넣기 =======================
   원본 작품의 '단계 ~ 단계' × '회차 ~ 회차' 실제 일정(시작일·완료일)을 대상 작품 같은 칸에 고정 날짜로 넣음.
   묶음 단계는 대상 묶음의 첫 회차에 해당하는 원본 칸의 날짜를 씀 (묶음 크기가 달라도 붙음)                  */
let CLIP=null;
function cpOpen(w,S,anchor){
  const st=S.ST.filter(s=>s.k!=="contract"), N=S.held?(S.N0||0):S.N;
  const opt=(v)=>st.map(s=>`<option value="${s.k}"${s.k===v?" selected":""}>${esc(labelOf(s,w))}</option>`).join("");
  const has=(k)=>st.some(s=>s.k===k);
  const pop=vPopAt(anchor,`<h4>${esc(w.n)} 일정 복사</h4><p class="ps">고른 범위의 실제 날짜를 복사해요 · 다른 작품을 열고 [붙여넣기]</p>
    <div class="row"><span>단계</span><select class="in" id="cpA">${opt(has("script")?"script":st[0].k)}</select> ~ <select class="in" id="cpB">${opt(has("mix")?"mix":st[st.length-1].k)}</select></div>
    <div class="row"><span>회차</span><input class="in n" type="number" id="cpE1" min="1" max="${N}" value="1"> ~ <input class="in n" type="number" id="cpE2" min="1" max="${N}" value="${N}"> 화</div>
    <div class="row"><span>빠른 선택</span><button type="button" class="q" data-cpq="script,mix">대사집~믹싱</button><button type="button" class="q" data-cpq="trans,burn">번역~자막 최종</button><button type="button" class="q" data-cpq="all">전체 단계</button></div>
    <div class="acts"><button type="button" class="btn" id="cpX">닫기</button><button type="button" class="btn pri" id="cpOk">복사</button></div>`);
  pop.querySelectorAll("[data-cpq]").forEach(b=>b.onclick=()=>{ const q=b.dataset.cpq;
    if(q==="all"){ $("cpA").value=st[0].k; $("cpB").value=st[st.length-1].k; return; }
    const [a,z]=q.split(","); if(has(a)) $("cpA").value=a; if(has(z)) $("cpB").value=z; });
  $("cpX").onclick=closePop;
  $("cpOk").onclick=()=>{ let i=st.findIndex(s=>s.k===$("cpA").value), j=st.findIndex(s=>s.k===$("cpB").value); if(i>j) [i,j]=[j,i];
    const e1=clamp(parseInt($("cpE1").value,10)||1,1,N), e2=clamp(parseInt($("cpE2").value,10)||N,e1,N), ks=st.slice(i,j+1).map(s=>s.k);
    CLIP={id:w.id,ks,e1,e2,lab:`${labelOf(st[i],w)}${i!==j?`~${labelOf(st[j],w)}`:""} · ${e1}~${e2}화`};
    $("pop").hidden=true; toast(`복사했어요: ${esc(w.n)} ${esc(CLIP.lab)} — 붙여넣을 작품을 왼쪽에서 고르세요`); render(); };
}
function cpPaste(T){
  const src=WORKS.find(x=>x.id===CLIP.id); if(!src){ CLIP=null; render(); return; }
  const SS=schedule(src), ST=schedule(T), N=Math.min(CLIP.e2,ST.held?(ST.N0||0):ST.N), ps=[], seen=new Set(), skip=[];
  CLIP.ks.forEach(k=>{ const stg=CONF.stages.find(x=>x.k===k); if(!stg||!ST.ST.some(x=>x.k===k)){ skip.push(k); return; }
    for(let e=CLIP.e1;e<=N;e++){ const E=ST.eps[e]; if(!E) continue; const c=E.cells[k]; if(!c||c.skip) continue;
      const kk=ovKey(c,stg,e); if(seen.has(kk)) continue; seen.add(kk);
      const se=c.work?1:c.batch?c.batch[0]:e, sc=SS.eps[se]&&SS.eps[se].cells[k]; if(!sc||sc.skip||!sc.e) continue;
      const o={...((T.ov||{})[kk]||{})}; delete o.d; delete o.ok; delete o.follow;
      o.f=key(sc.e); if(sc.s&&sc.s<=sc.e) o.s=key(sc.s); else delete o.s; o.lock=true;
      ps.push({p:["ov",kk],v:o}); } });
  if(!ps.length){ toast("붙여넣을 칸이 없어요 (대상 작품에 없는 단계·회차일 수 있어요)"); return; }
  if(!confirm(`${src.n}의 ${CLIP.lab} 일정을 ${T.n}에 똑같이 넣을까요?\n${ps.length}칸에 시작일·완료일이 고정 날짜로 들어가요. (완료 체크·메모는 그대로)`)) return;
  edit(T.id,ps);
  if(skip.length) toast(`${T.n}에 없는 단계는 건너뛰었어요: ${skip.map(k=>(CONF.stages.find(x=>x.k===k)||{}).s||k).join(", ")}`);
}

  const bg=(r)=>K.map((k,i)=>`<div class="pgc${HOL.has(k)?" hol":""}${i===tIdx?" td":""}${goalIdx.has(i)?" gl":""}${i%5===0?" wk":""}" style="grid-row:${r};grid-column:${i+2}"></div>`).join("");

    h+=`<div class="pggoal" style="--c:${PG_COL.goal}"><span class="pgf">⚑</span><div><b>최종 목표 · ${md(D(g1.to))}(${WDK[D(g1.to).getUTCDay()]}) ${esc(g1.text)}</b>
      <div class="hint">${esc(g1.w.n)} · 오늘 ${md(TODAY)} 기준</div></div><span class="pgd">${dd===0?"D-DAY":`D-${dd}`}</span>
      <button type="button" class="btn" data-pmemo="${g1.w.id}" data-pmi="${g1.i}" style="padding:2px 9px;font-size:12px">수정</button></div>`; }

  // 머리: 주 · 날짜
  let r=1; h+=`<div class="pgh lab" style="grid-row:1 / 3;grid-column:1">${on.length===1?esc(on[0].n):`${on.length}작품`}</div>`;
  for(let i=0;i<nC;i+=5){ h+=`<div class="pgh wk" style="grid-row:1;grid-column:${i+2} / ${Math.min(i+5,nC)+2}">${md(days[i])} 주</div>`; }

  let any=false;

    <div class="legend">${[["trans","번역"],["video","영상"],["appr","승인·피드백"],["sound","사운드"],["final","자막·등급"],["memo","메모 일정"]].map(([k,l])=>`<span><i style="background:${PG_COL[k]}"></i>${l}</span>`).join("")}

}
const pcLs=(k)=>{ try{ return JSON.parse(localStorage.getItem(k)||"[]")||[]; }catch(e){ return []; } };
const PC_OFF=new Set(pcLs("anime_pc_off")), PC_GOFF=new Set(pcLs("anime_pc_goff"));
const PC_GROUPS=[["memo","메모 일정",["memo"]],["video","영상",["prod1","fix3","prodF","imgcut"]],["appr","승인·피드백",["fb3","author","intAppr","ratingFb","dubchk","contract"]],
  ["trans","번역",["trans","vtrans","subtr"]],["sound","사운드",["script","casting","dub","mix"]],["final","자막·등급",["burn","rating"]]];
const pcGroup=(k)=>(PC_GROUPS.find(g=>g[2].includes(k))||["etc"])[0];
const PC_COL=["#2B6FD0","#D9622B","#2E9B6A","#8E44C9","#C9384F","#1C9BAA","#B8860B","#5A6B7D","#D14E9A","#4C7A1E","#7A4E2B","#3C4FB5"];
function pcItems(works){
  const out=[];
  works.forEach(w=>{ const S=schedule(w), N=S.held?(S.N0||0):S.N, seen=new Set();
    for(let k=1;k<=N;k++){ const E=S.eps[k]; if(!E) continue;
      S.ST.forEach(st=>{ const c=E.cells[st.k]; if(!c||c.skip||!c.e) return; if(PC_GOFF.has(pcGroup(st.k))) return;
        const kk=ovKey(c,st,k); if(seen.has(kk)) return; seen.add(kk);
        const from=c.due||c.gate==="info"&&!c.s?c.e:(c.s||c.e);
        out.push({w,st,k:c.work?1:c.batch?c.batch[0]:k,from:key(from<=c.e?from:c.e),to:key(c.e),
          ep:c.work?"":c.batch?`${c.batch[0]}~${c.batch[1]}화`:`${k}화`,ok:isOk(c),late:!isOk(c)&&c.e<TODAY,m:c.m||"",pin:!!(c.kind==="fix"||((w.ov||{})[kk]||{}).s)}); }); }
  });
  if(!PC_GOFF.has("memo")) works.forEach(w=>(w.cev||[]).forEach((e,i)=>{ if(!e.date) return;
    out.push({w,memo:true,goal:!!e.goal,i,st:{k:"memo"},k:0,from:e.goal?(e.to&&e.to>e.date?e.to:e.date):e.date,to:e.to&&e.to>e.date?e.to:e.date,ep:"",text:e.text||"",ok:!!e.done,late:false,m:""}); }));
  const PRI={memo:-1,fb3:0,author:0,intAppr:0,ratingFb:0,fix3:1,prodF:1};   // 승인·피드백 → 수정 → 나머지 순으로 위에
  return out.sort((a,b)=>((PRI[a.st.k]??2)-(PRI[b.st.k]??2))||a.from.localeCompare(b.from)||(a.w.pos||0)-(b.w.pos||0));
}

      <span class="hint">${on.length}작품 · 이번 달 공정 ${items.filter(x=>x.to>=key(start)&&x.from<=key(addDays(start,41))).length}건</span>`}</div>`;

  /* 주 단위로 그리기: 한 일정은 그 주 안에서 한 줄 막대로 이어짐 (주가 바뀌면 다음 줄에서 이어서) */

  for(let wkI=0;wkI<6;wkI++){

  h+=`<div class="gtools"><div class="legend">
      <span>칸을 누르면 소요일 · 완료일을 고칠 수 있습니다 (영업일 · 한국 공휴일 제외)</span>
      <span><b style="color:var(--warn)">▢</b> 소요일 변경</span><span><b style="color:var(--good)">●</b> 칸 오른쪽 동그라미 = 완료 처리</span><span><b style="color:var(--bad)">▎</b> 예정일 지남 · 완료 확인 필요</span><span><b>◆</b> 완료일 지정</span><span><i class="mm" style="white-space:nowrap;font-style:normal;font-size:10px;font-weight:700;background:var(--page);padding:0 4px;border-radius:3px">메모</i> 마우스를 올리거나 눌러서 확인</span>
      <span><b style="color:var(--bad)">+n</b> 기본 공정보다 늦어진 영업일</span>
      <span style="background:#F4F3EC;padding:0 6px;border-radius:4px">음영 열 = ${BATCH}화 묶음 · 작품 1회 단계</span>
    </div></div>
    <div class="gridwrap"><table class="eg"><thead><tr><th class="ep">회차</th><th class="lenh">길이<small>분:초</small></th>`;
  S.ST.forEach(s=>h+=`<th class="${s.sc!=="ep"&&s.k!=="prod1"?"dubh":""}" title="${esc(s.n)} · ${SC_LABEL[s.k==="prod1"?"ep":s.sc]}${s.sc==="ep"&&uptoOf(s,w)>0?` · 1~${uptoOf(s,w)}화만`:""}${s.sc==="work"?(s.gate==="open"?" · 런칭 전까지 완료":" · 다음 단계가 기다림"):""}">${esc(labelOf(s,w))}${s.sc==="ep"&&uptoOf(s,w)>0?` <span class="upto">1~${uptoOf(s,w)}화</span>`:""}${s.tbdDur&&!(durOf(s,w)>0)?` <span class="upto" style="background:var(--warn-bg);color:var(--warn)" title="업체·기간 미정 — 작업 챙기기용 (일정에는 영향 없음)">기간 미정</span>`:""}${fb3On(w)&&ext4Keep(s,w)?` <span class="upto" title="1~3화는 통합 피드백으로 대신">4화부터</span>`:""}${!fb3On(w)&&concOf(s,w)&&(s.conc==="ext"||s.conc==="author")?` <span class="upto" title="1~3화는 작가 승인과 동시에 진행(추가 기간 없음) · 4화부터 ${durOf(s,w)}일 따로">1~3화 병렬</span>`:""}${s.sc==="grp"?` <span class="upto" title="1~${s.grp||3}화 영상 1차가 모두 끝나면 한 번에 진행">1~${s.grp||3}화 한번에</span>`:""}${s.par?` <span class="upto" title="다음 단계와 동시에 진행 — 자막 최종 영상본 전까지만 끝나면 됨">병행</span>`:""}<small>${esc(teamOf(s,w))}</small></th>`);
  h+=`<th class="rd">최종본 완료<small>오픈 ${CONF.lockBD}영업일 전까지</small></th><th class="op">오픈일<small>${S.held?"런칭 미정":`매주 ${WD[S.L.getUTCDay()]}요일`}</small></th></tr></thead><tbody>`;
  const NR=S.held?(S.N0||0):S.N;   // 실제 계산된 회차 수

    S.ST.forEach(s=>{
      const c=E.cells[s.k], bc=BE.cells[s.k];

        const late=bc?bdDiff(bc.e,c.e):0;
        h+=`<td class="bt wk" rowspan="${lim}">${ckBtn(c,1,s)}<button type="button" class="cl ${c.kind}${stCls(c)}" data-ep="1" data-s="${s.k}" title="${esc(s.n)} · 작품 1회 · ${c.s?ymd(c.s)+" ~ ":""}${ymd(c.e)}${c.m?"\n"+esc(c.m):""}">

        return;
      }
      if(c.batch){
        const [a,b]=c.batch; if(k!==a) return;
        const span=Math.min(b,lim)-a+1;
        const late=bc?bdDiff(bc.e,c.e):0;
        h+=`<td class="bt" rowspan="${span}">${ckBtn(c,a,s)}<button type="button" class="cl ${c.kind}${stCls(c)}" data-ep="${a}" data-s="${s.k}" title="${esc(s.n)} ${a}~${b}화 묶음 · ${c.s?ymd(c.s)+" ~ ":""}${ymd(c.e)}${c.m?"\n"+esc(c.m):""}">
          <span class="bl">${a}~${b}화</span><span class="dt">${mdY(c.e)}</span><span class="du">${duTxt(c,late)}${c.m?` <i class="mm">메모</i>`:""}</span></button></td>`;
        return;
      }
      if(c.done&&c.kind!=="fix"&&c.kind!=="ok"){ h+=`<td>${ckBtn(c,k,s)}<button type="button" class="cl ok" data-ep="${k}" data-s="${s.k}" title="${esc(s.n)} ${k}화 · 완료"><span class="dt">완료</span><span class="du">1차 제작 끝${c.m?` <i class="mm">메모</i>`:""}</span></button></td>`; return; }
      const late=bc&&!c.done?bdDiff(bc.e,c.e):0;
      h+=`<td>${ckBtn(c,k,s)}<button type="button" class="cl ${c.done?"ok":c.kind}${stCls(c)}" data-ep="${k}" data-s="${s.k}" title="${esc(s.n)} ${k}화 · ${c.s?ymd(c.s)+" ~ ":""}${ymd(c.e)}${c.m?"\n"+esc(c.m):""}">
        <span class="dt">${mdY(c.e)}</span><span class="du">${c.done?"완료":duTxt(c,late)}${c.m?` <i class="mm">메모</i>`:""}</span></button></td>`;

    const isC=k===S.crit;
    h+=`<td class="opc${isC?" crit":""}" title="오픈 ${ymd(E.open)} · 최종본 여유 ${E.slack}영업일"><div class="ov">${mdY(E.open)}${k===1?`<span class="badge l">런칭</span>`:""}${isC?`<span class="badge c">기준</span>`:""}</div>
      <div class="du">여유 ${E.slack}일</div></td></tr>`;
  }
  if(S.held){   // 중단된 회차부터는 계산하지 않음
    const p=S.held;
    h+=`<tr class="pzrow"><td class="ep">${p.ep}~${S.N}화</td><td colspan="${S.ST.length+3}">
      <span class="pzl2">${isHire(p)?"⏳ 착수 대기 — 신규 인력이 충원되면 착수 (기존 인력은 현재 작품 계속 연재)":`⏸ ${ymd(D(p.from))}부터 제작 중단 · 재개 미정`}</span>
      <button type="button" class="btn pri" data-resume="${p.ep}" style="padding:3px 10px;margin-left:8px">${isHire(p)?"▶ 착수일 정하기":"▶ 활성화 (재개일 정하기)"}</button>
      ${isHire(p)?"":`<button type="button" class="btn" data-unpause="${p.ep}" style="padding:3px 10px;margin-left:4px">중단 취소</button>`}</td></tr>`;
  }
  h+=`</tbody></table></div>`;
  h+=`<div class="epadd">${NR>lim||SHOWALL?`<button type="button" class="btn" id="more">${SHOWALL?"접기":`나머지 ${NR-lim}화 보기`}</button>`:""}
    <span class="sp"></span><span class="hint">현재 총 ${S.N}화</span>
    <button type="button" class="btn" data-addep="-5"${S.N<=5?" disabled":""}>− 5화</button>
    <button type="button" class="btn pri" data-addep="5">+ 5화 추가</button></div>`;
  h+=`<p class="hint" style="margin-top:10px">'기준' 표시 회차가 런칭일을 정합니다. 이 회차를 당기면(소요일 단축·인력 추가) 런칭도 당겨지고, 여유가 0에 가까운 회차가 밀리면 런칭이 뒤로 갑니다.</p></div></div>`;
  $("v-prod").innerHTML=h;

  document.querySelectorAll(".wi").forEach(b=>b.onclick=()=>{SEL=b.dataset.w;SHOWALL=false;render();});
  bindPview();
  bindWorkDrag();
  $("addW").onclick=(e)=>{e.stopPropagation();addWork(e);};
  $("delW").onclick=()=>{ if(confirm(`'${w.n}' 작품을 삭제합니다. 모든 사람 화면에서 사라집니다. 계속할까요?`)) delWork(w.id); };
  if($("more")) $("more").onclick=()=>{SHOWALL=!SHOWALL;render();};
  document.querySelectorAll("#v-prod .tdgo").forEach(b=>b.onclick=()=>{ SEL=b.dataset.tw; FOCUS={k:+b.dataset.tk,s:b.dataset.ts}; SHOWALL=+b.dataset.tk>20?true:SHOWALL; render(); });
  document.querySelectorAll("#v-prod .tdok").forEach(b=>b.onclick=()=>{ const ww=WORKS.find(x=>x.id===b.dataset.tw); if(!ww) return; toggleDone(ww,schedule(ww),+b.dataset.tk,b.dataset.ts); });
  document.querySelectorAll("#v-prod .tdmore").forEach(b=>b.onclick=()=>{ TODAY_MORE=true; render(); });
  document.querySelectorAll("#v-prod .tdless").forEach(b=>b.onclick=()=>{ TODAY_MORE=false; render(); });
  if(FOCUS){ const el=document.querySelector(`#v-prod .cl[data-ep="${FOCUS.k}"][data-s="${FOCUS.s}"]`); FOCUS=null;

  document.querySelectorAll("#v-prod [data-addep]").forEach(b=>b.onclick=()=>{
    const n=clamp((+w.total||0)+(+b.dataset.addep),5,300); SHOWALL=true; edit(w.id,[{p:["total"],v:n}]); });
  document.querySelectorAll("#v-prod [data-f]").forEach(el=>el.onchange=()=>{
    const fk=el.dataset.f; let v=el.value;
    if(["done","rate","total","b1"].includes(fk)){ v=parseInt(v,10); if(isNaN(v))return;
      const lm={done:[0,300],rate:[1,60],total:[1,300],b1:[1,300]}[fk]; v=clamp(v,lm[0],lm[1]); }
    else if(fk==="n"){ v=v.trim()||"이름 없음"; }
    else if(fk==="nJa"){ v=v.trim(); if(!v){ edit(w.id,[{p:["nJa"],del:true}]); return; } }
    else if((fk==="start"||fk==="launch")&&!v) return;
    else if(fk==="start"){ v=key(snapBD(D(v))); }   // 착수일은 영업일로
    if(fk==="start"){   // 착수일을 정하면 런칭은 휴재 없는 가장 빠른 날로 자동
      edit(w.id,[{p:["start"],v},{p:["launchAuto"],v:true},{p:["launchByPlan"],del:true},{p:["launch0"],del:true}]); return; }
    if(fk==="launch"){ edit(w.id,[{p:["launch"],v},{p:["launchAuto"],del:true}]); return; }
    edit(w.id,[{p:[fk],v}]);
  });
  document.querySelectorAll("#v-prod [data-sel]").forEach(el=>el.onchange=()=>{
    if(el.dataset.sel==="voice"){ edit(w.id,[{p:["voice"],v:el.value}]); return; }
    if(el.dataset.sel==="fb3"){ edit(w.id,[el.value==="1"?{p:["fbLegacy"],del:true}:{p:["fbLegacy"],v:true}]); return; }
    if(el.dataset.sel==="lauto"){ edit(w.id,el.value==="1"?[{p:["launchAuto"],v:true},{p:["launchByPlan"],del:true}]:[{p:["launchAuto"],del:true},{p:["launch"],v:w.launch&&!w.launchAuto?w.launch:key(schedule(w).L||TODAY)}]); return; }
    if(el.dataset.sel==="age"){ edit(w.id,[el.value?{p:["age"],v:el.value}:{p:["age"],del:true}]); return; }
    if(el.dataset.sel==="cont"){ edit(w.id,[{p:["cont"],v:el.value==="1"}]); return; }
    const ext=el.value==="ext", tmp={...w,team:ext?{...(w.team||{}),prod1:"외부 제작사",prodF:"외부 제작사"}:{}};
    const ps=ext?[{p:["team","prod1"],v:"외부 제작사"},{p:["team","prodF"],v:"외부 제작사"},{p:["line"],v:"ext"}]
               :[{p:["team","prod1"],del:true},{p:["team","prodF"],del:true},{p:["line"],v:"int"}];
    tmp.line=el.value; ps.push({p:["rate"],v:defRate(tmp)});   // 라인 기본 1차 제작 일수로
    edit(w.id,ps);
  });
  $("cpCopy").onclick=(e)=>{ e.stopPropagation(); cpOpen(w,S,e.currentTarget); };
  if($("cpPaste")) $("cpPaste").onclick=()=>cpPaste(w);
  if($("cpClear")) $("cpClear").onclick=()=>{ CLIP=null; render(); };
  if($("fb3Go")) $("fb3Go").onclick=()=>{ edit(w.id,[{p:["fbLegacy"],del:true}]); };
  document.querySelectorAll("#v-prod [data-pause]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    const k=+b.dataset.pause, c=S.eps[k]&&S.eps[k].cells.prod1, from=c&&c.s&&c.s>TODAY?c.s:TODAY;
    if(!confirm(`${k}화부터 제작을 중단합니다. 재개일을 정할 때까지 런칭은 '미정'으로 표시됩니다.`)) return;
    const others=(w.pauses||[]).filter(p=>p.ep<k&&p.resume);
    edit(w.id,[{p:["pauses"],v:[...others,{ep:k,from:key(from),resume:null}]}]); });
  document.querySelectorAll("#v-prod [data-resume]").forEach(b=>b.onclick=(e)=>{e.stopPropagation(); openResume(w,+b.dataset.resume,b);});
  document.querySelectorAll("#v-prod [data-unpause]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    if(!confirm("중단 표시를 없애고 원래 일정대로 계산할까요?")) return;
    edit(w.id,[{p:["pauses"],v:(w.pauses||[]).filter(p=>p.ep!==+b.dataset.unpause)}]); });
  document.querySelectorAll("#v-prod [data-len]").forEach(el=>el.onchange=()=>{ const v=parseLen(el.value), k=el.dataset.len;
    if(v===null){ edit(w.id,[{p:["len",k],del:true}]); return; }
    if(isNaN(v)||v<=0||v>3600){ el.style.borderColor="var(--bad)"; toast("길이는 3:30처럼 분:초로, 또는 3.5처럼 분으로 적어 주세요"); return; }
    edit(w.id,[{p:["len",k],v}]); });
  document.querySelectorAll("#v-prod .ck[data-ck]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();toggleDone(w,S,+b.dataset.ck,b.dataset.s);});
  document.querySelectorAll("#v-prod .cl[data-ep]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();openPop(w,S,+b.dataset.ep,b.dataset.s,b);});
}

/* 칸 편집 팝오버 */
function openPop(w,S,k,sk,anchor){
  const pop=$("pop"), E=S.eps[k], s=CONF.stages.find(x=>x.k===sk), c=E.cells[sk];
  const K=ovKey(c,s,k), o=(w.ov||{})[K]||{};
  const bt=c.batch, label=c.work?"작품 1회":bt?`${bt[0]}~${bt[1]}화 묶음`:`${k}화`;
  const dv=o.d!=null?o.d:c.base;
  const nextLab=bt?"다음 묶음에도":`${k+1}화 이후에도`;
  pop.innerHTML=`<h4>${label} · ${esc(s.n)}</h4><p class="ps">${esc(teamOf(s,w))} · 지금 ${c.s?ymd(c.s)+" ~ ":""}${ymd(c.e)}</p>
    ${c.done&&!o.f?"":`<div class="row"><span>소요 영업일</span><input class="in n" type="number" min="0" max="120" id="pD" value="${dv}">
      <button type="button" class="q" data-q="1">+1</button><button type="button" class="q" data-q="2">+2</button><button type="button" class="q" data-q="5">+5</button></div>
    <p class="note">기본 ${c.base}일${sk==="prod1"?" (작품 설정값)":""} · 주말·공휴일은 세지 않습니다</p>
    ${c.work||c.grp?"":`<label class="chk"><input type="checkbox" id="pAll"> ${nextLab} 같은 소요일 적용</label>`}`}
    <div class="row"><span>시작일 지정</span><input class="in" type="date" id="pS" value="${o.s||""}"></div>
    <div class="row"><span>완료일 지정</span><input class="in" type="date" id="pF" value="${o.f||""}"></div>
    <p class="note">시작일만 넣으면 그날부터 소요일만큼, 시작일·완료일을 둘 다 넣으면 그 기간으로 잡아요.</p>
    <p class="note">실제로 끝난 날이나 확정한 날짜. 앞 단계보다 먼저 끝나도 그대로 지켜요(병행으로 계산). 주말·휴일이어도 그 날짜로 기록해요.</p>
    <label class="chk"><input type="checkbox" id="pSlip"${o.follow?" checked":""}> 앞 단계가 늦어지면 이 날짜도 뒤로 밀기</label>

function applyPatch(o,{p,v,del}){
  let x=o; for(let i=0;i<p.length-1;i++){ if(typeof x[p[i]]!=="object"||x[p[i]]===null) x[p[i]]={}; x=x[p[i]]; }
  if(del) delete x[p[p.length-1]]; else x[p[p.length-1]]=v;
}

function errMsg(e){
  const m=String(e&&e.message||e), code=(m.match(/^(\d{3})/)||[])[1];
  if(!code) return ["주소(URL)에 접속하지 못했어요 — 인터넷 또는 URL 확인",m];
  if(code==="401") return ["키가 맞지 않아요 (401) — Publishable key 확인",m];
  if(code==="404") return ["테이블을 못 찾았어요 (404) — SQL 실행 여부 확인",m];
  if(code==="403"||/42501|permission/i.test(m)) return ["권한이 없어요 (403) — SQL의 grant 줄 실행 확인",m];
  return [`연결 오류 (${code})`,m];

    const rows=await sb("GET","app_users",`?id=eq.${uid}&select=*`);

  }catch(e){ showGate("login",`로그인 확인 중 문제가 생겼어요: ${e.message}`); return false; }
  if(!ME.approved){ showGate("wait"); return false; }

async function sb(method,table,q="",body,prefer){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${q}`,{method,cache:"no-store",
    headers:{apikey:SUPABASE_ANON_KEY,...authHeader(),"Content-Type":"application/json",...(prefer?{Prefer:prefer}:{})},
    body:body?JSON.stringify(body):undefined});
  if(r.status===401&&AUTH_REQUIRED&&!sb._retry){   // 로그인 만료 → 한 번 갱신 후 재시도
    if(await refreshSession()){ sb._retry=true; try{ return await sb(method,table,q,body,prefer); } finally{ sb._retry=false; } }
    showGate("login","로그인이 만료됐어요. 다시 로그인해 주세요."); }
  if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  const t=await r.text(); return t?JSON.parse(t):null;
}

async function pullAll(force){
  const rows=await sb("GET",T_WORKS,"?select=id,pos,data,updated_at&order=pos.asc");

  rows.forEach(r=>{

    if(!force&&SEEN[r.id]===r.updated_at) return;
    SEEN[r.id]=r.updated_at;
    const w=normW({...r.data,id:r.id,pos:r.pos});
    const i=WORKS.findIndex(x=>x.id===r.id); if(i<0) WORKS.push(w); else WORKS[i]=w; changed=true;
  });
  const before=WORKS.length;
  WORKS=WORKS.filter(w=>ids.has(w.id)||(PENDING[w.id]&&PENDING[w.id].length));
  if(WORKS.length!==before) changed=true;
  WORKS.sort((a,b)=>(a.pos||0)-(b.pos||0));
  if(cf&&cf.length&&(force||cf[0].updated_at!==CONF_SEEN)){ CONF=normConf(cf[0].data); setHol(CONF.hol); CONF_SEEN=cf[0].updated_at; changed=true; }
  try{ if(await vPull(force)) changed=true; }catch(e){ console.warn("외주사 목록을 불러오지 못했어요",e); }
  try{ if(await lpPull(force)) changed=true; }catch(e){ console.warn("외주사 목록을 불러오지 못했어요",e); }

}

function vMyOwner(owners){

  const alias={yunjeong:["윤정","yunjeong","myun"],haruki:["하루키","haruki","hirofumi"]};
  for(const o of owners){ const a=alias[o.toLowerCase()]||[o.toLowerCase()]; if(a.some(x=>nm.includes(x))) return o; }

}
function vNextBoard(all){

  const t=key(TODAY), wk=key(addDays(TODAY,7)), po={high:0,mid:1,low:2};

    ${rows.length?"":`<p class="hint" style="margin:8px 0 0">${mine==="*"?"":esc(mine)+" 담당 "}진행 중인 외주사가 없어요.</p>`}

      <button type="button" class="vnbn" data-goto="${r.v.id}">${esc(r.v.name)}</button><span class="vkt k-${vKind(r.v)}">${vKindL(vKind(r.v)).replace(" 외주","")}</span>

      ${r.what?`<span class="vnbw">→ <span data-tx data-notr>${esc(r.what)}</span>${vTo(r.v)?` <span class="hint">(${vFrom(r.v)?esc(vFrom(r.v).slice(5).replace("-","/"))+"~":""}${esc(vTo(r.v).slice(5).replace("-","/"))}까지)</span>`:""}</span>`:""}

function vInline(el){
  if(el.querySelector("textarea")) return;
  const v=VENDORS.find(x=>x.id===el.dataset.vid), k=el.dataset.vk; if(!v) return;
  const memo=k==="note";   // 비고는 메모장처럼: Enter = 줄바꿈, 다른 곳 누르면 저장
  const fit=()=>{ ta.rows=Math.max(memo?3:1,Math.min(memo?18:6,(ta.value.match(/\n/g)||[]).length+1)); };
  const ta=document.createElement("textarea"); ta.className="vin"+(memo?" memo":""); ta.value=v[k]||""; fit();
  el.innerHTML=""; el.appendChild(ta); if(memo){ const h=document.createElement("div"); h.className="vmh"; h.textContent="Enter 줄바꿈 · 다른 곳 클릭 또는 Ctrl/⌘+Enter 저장 · Esc 취소"; el.appendChild(h); }
  el.classList.add("editing"); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
  let done=false;
  const fin=(save)=>{ if(done) return; done=true; el.classList.remove("editing");
    const nv=ta.value.trim();
    if(save&&nv!==(v[k]||"")){ if(k==="name"&&!nv){ toast("외주 제작사 이름은 비울 수 없어요"); render(); return; } vEdit({op:"set",id:v.id,v:{[k]:nv}}); }
    else render(); };
  ta.onkeydown=(e)=>{
    if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); fin(true); return; }
    if(e.key==="Enter"&&!e.shiftKey&&!memo&&!e.isComposing){ e.preventDefault(); fin(true); }
    else if(e.key==="Escape"){ e.preventDefault(); fin(false); } };
  ta.oninput=fit;
  ta.onblur=()=>fin(true);
}
function vEditor(v,anchor){
  const isNew=!v; v=v||{id:"v"+Date.now().toString(36),kind:VF.kind||"video",country:"한국",prio:"mid",stage:"contact",owner:(ME&&ME.name)||""};
  const F=[["name","외주 제작사","text"],["kind","구분","kind"],["country","국가","country"],["prio","우선순위","prio"],["stage","진행 단계","stage"],["status","진행 상황","area"],["from","일정 시작일","date"],["to","일정 종료일 (기한)","date"],["interest","관심·배정 작품","text"],["owner","컨택 담당자","text"],["contact","상대 담당자","text"],["email","이메일","text"],["phone","전화","text"],
    ["url","링크 (여러 개는 줄바꿈)","area"],["intro","소개","area"],["price","단가 (예: 분당 ○원)","text"],["note","비고","area"]];
  const inp=([k,l,t])=>`<label class="vf"><span>${l}</span>${t==="kind"?`<select class="in" data-ef="${k}">${V_KINDS.map(([a,b])=>`<option value="${a}"${vKind(v)===a?" selected":""}>${b}</option>`).join("")}</select>`:t==="country"?`<select class="in" data-ef="${k}">${V_COUNTRY.map(c=>`<option${v[k]===c?" selected":""}>${c}</option>`).join("")}</select>`
    :t==="prio"?`<select class="in" data-ef="${k}">${V_PRIO.map(([a,b])=>`<option value="${a}"${(v[k]||"mid")===a?" selected":""}>${b}</option>`).join("")}</select>`
    :t==="stage"?`<select class="in" data-ef="${k}">${V_STAGES.map(([a,b])=>`<option value="${a}"${(v[k]||"contact")===a?" selected":""}>${b}</option>`).join("")}</select>`
    :t==="area"?`<textarea class="in" data-ef="${k}" rows="2">${esc(v[k]||"")}</textarea>`:`<input class="in" type="${t==="date"?"date":"text"}" data-ef="${k}" value="${esc(v[k]||"")}">`}</label>`;
  const pop=$("pop"); pop.classList.add("wide");
  pop.innerHTML=`<h4>${isNew?"외주사 추가":esc(v.name)+" 수정"}</h4><div class="vgrid">${F.map(inp).join("")}</div>
    <div class="acts">${isNew?"":`<button type="button" class="btn danger" id="veDel">삭제</button><span style="flex:1"></span>`}<button type="button" class="btn" id="veX">닫기</button><button type="button" class="btn pri" id="veOk">${isNew?"추가":"저장"}</button></div>`;
  pop.hidden=false;
  const r=anchor.getBoundingClientRect(), cw=document.documentElement.clientWidth;
  pop.style.left=Math.max(8,Math.min(r.left+window.scrollX-300,window.scrollX+cw-640))+"px"; pop.style.top=(r.bottom+window.scrollY+6)+"px";
  const close=()=>{ pop.classList.remove("wide"); closePop(); };
  $("veX").onclick=close;
  $("veOk").onclick=()=>{ const o={}; pop.querySelectorAll("[data-ef]").forEach(el=>{ o[el.dataset.ef]=el.value.trim(); });
    if(!o.name){ toast("외주 제작사 이름을 넣어 주세요"); return; }
    vEdit(isNew?{op:"add",v:{...v,...o,upd:key(TODAY),updBy:(ME&&(ME.name||ME.email))||""}}:{op:"set",id:v.id,v:o}); close(); };
  if($("veDel")) $("veDel").onclick=()=>{ if(confirm(`'${v.name}'을(를) 목록에서 삭제할까요? 모든 사람 화면에서 사라집니다.`)){ vEdit({op:"del",id:v.id}); close(); } };
}

  lp2Ensure(); LPV.peek=null; const PK=null;   // 기록 보기 없이 항상 현재 버전 (바꾸면 바로 공유 저장)
  const P=PK?PK.plan:LP.cur, g=P.g, C=lp2Compute(P), M=LP2_M, ro=!!PK;
  const yb=(i)=>M[i].endsWith("-01")?" yb":"";
  const mh=`<tr><th class="tl"></th>${M.map((m,i)=>`<th class="${yb(i)}${m===key(TODAY).slice(0,7)?" now":""}">${m.slice(2,4)}.${+m.slice(5)}</th>`).join("")}</tr>`;
  const fmt=(v,dec)=>v?(dec?(Math.round(v*10)/10):v):"–";
  const TIP={"연재 작품 수":"그 달 말에 연재 중인 작품 수예요. 런칭 후 (시즌 화수 − 런칭 공개 화수)주 동안 연재 중으로 셉니다.",
    "런칭 준비 작품 수":"그 달에 최종본이 준비돼 '런칭할 수 있게 된' 작품 수예요. 착수월 + 착수→런칭 주수로 계산해요.",
    "런칭 작품 수":"실제로 문을 여는 작품 수예요. 준비된 작품을 대기열에 넣었다가 월 런칭 수가 줄지 않게 고르게 내보내요.",
    "런칭 대기 (월말)":"준비는 됐지만 평준화 때문에 아직 런칭하지 않고 기다리는 작품 수예요.",
    "제작 회차 수":"그 달에 영상 1차를 만드는 회차 수예요 (회차당 영업일 기준 · 제작비 계산에 쓰여요).",
    "그중 AI 성우 회차":"제작 회차 중 AI 성우로 만드는 회차 수예요.",
    "그중 AI 성우":"위 숫자 중 AI 성우 작품 수예요.",
    "연재 목표":"달성하고 싶은 그 달 연재 작품 수예요. 칸에 바로 입력해요.",
    "목표 대비":"연재 작품 수 − 연재 목표. 초록은 달성, 빨강은 부족이에요."};
  const tipOf=(lab)=>{ const t=String(lab).replace(/<[^>]+>/g,"").trim(); const k=Object.keys(TIP).find(x=>t.startsWith(x)||t.includes(x)); return k?TIP[k]:""; };
  const rowR=(lab,arr,cls,dec)=>`<tr class="${cls||""}"><td class="tl"${tipOf(lab)?` data-tip="${esc(tipOf(lab))}"`:""}>${lab}${tipOf(lab)?`<span class="tipi">?</span>`:""}</td>${arr.map((v,i)=>`<td class="${yb(i)}${v?"":" z"}">${fmt(v,dec)}</td>`).join("")}</tr>`;
  const tg=P.targets.onair||{};
  let h=`<div class="lphead"><div><p class="lead" style="margin:0">런칭 플랜 계산기</p>
      <div class="lpst"><span id="lpSt">${lpStatTxt()}</span> <button type="button" class="lpundo" id="lpUndo">↶ 이전 상태로</button> <button type="button" class="lpundo" id="lpBase" title="엑셀 시뮬레이터 값으로 처음부터 다시 (지금 값은 자동 보관)">엑셀 기본값으로</button></div></div>
    </div>`;
  // 목표 카드
  h+=`<div class="lpkgrid">${Object.entries(tg).map(([m,t])=>{ const i=M.indexOf(m); if(i<0) return ""; const a=C.tot.onair[i], d=a-t; return `<div class="lpk ${d>=0?"ok":"bad"}"><div class="lpkl">${m.slice(2,4)}.${+m.slice(5)} 연재 작품 수</div><div class="lpkv">${a}<span>목표 ${t} · ${d>=0?"+":""}${d}</span></div></div>`; }).join("")}
    <div class="lpk" style="border-left-color:var(--launch)"><div class="lpkl">총 착수 (26.7~28.12)</div><div class="lpkv">${C.tot.start.reduce((a,b)=>a+b,0)}<span style="color:var(--ink2)">AI ${C.works.filter(w=>w.voice==="ai").length}편</span></div></div></div>`;
  // ── 결과 (하얀 표) ──
  h+=`<div class="lpsec">결과 <span class="hint">자동 계산 · 팀별 합계</span><span class="vsp"></span>
    ${ro?"":`<button type="button" class="btn" id="lpCurve" style="padding:3px 10px;font-size:12px" title="엑셀 기존 계획의 월별 연재 작품 수를 목표 줄에 채움">기존 계획 곡선을 목표로</button>
    <button type="button" class="btn pri" id="lpSolve" style="padding:3px 10px;font-size:12px" title="목표 연재 수는 그대로 · 착수 편수·착수월·외주 제작사 수를 조정">목표에 맞춰 역산</button>`}</div>
  <div class="card" style="padding:0;overflow-x:auto"><table class="lp2 res"><colgroup><col style="width:210px">${M.map(()=>`<col style="width:48px">`).join("")}</colgroup><thead>${mh}</thead><tbody>
    ${rowR("연재 작품 수",C.tot.onair,"tot")}
    ${P.groups.map(G=>rowR(`<span class="ind">ㄴ ${esc(G.id)}</span>`,C.R.onair[G.id],"sub")).join("")}
    <tr class="tgr"><td class="tl" data-tip="${esc(TIP["연재 목표"])}">연재 목표 <span class="hint">입력</span><span class="tipi">?</span></td>${M.map((m,i)=>`<td class="${yb(i)}"><input class="lp2t" data-tg="${m}" value="${esc(tg[m]??"")}" placeholder="·"${ro?" disabled":""}></td>`).join("")}</tr>
    <tr class="dif"><td class="tl" data-tip="${esc(TIP["목표 대비"])}">목표 대비<span class="tipi">?</span></td>${M.map((m,i)=>{ const t=tg[m]; if(t==null||t==="") return `<td class="${yb(i)}"></td>`; const d=C.tot.onair[i]-t; return `<td class="${yb(i)} ${d>=0?"okc":"badc"}">${d>=0?"+":""}${d}</td>`; }).join("")}</tr>
    ${rowR("런칭 준비 작품 수",C.tot.ready,"tot")}
    ${P.groups.map(G=>rowR(`<span class="ind">ㄴ ${esc(G.id)}</span>`,C.R.ready[G.id],"sub")).join("")}
    ${rowR(`<span class="ind ai">ㄴ 그중 AI 성우</span>`,C.tot.readyAi,"sub ai")}
    ${rowR(`런칭 작품 수 <span class="hint" style="font-weight:400">${!C.SM||!C.SM.cap?"준비되는 대로":C.SM.cap==="auto"?"평준화 (줄지 않게)":`월 최대 ${C.SM.cap}편`}</span>`,C.tot.launch,"tot lpact")}
    ${C.SM&&C.SM.cap?rowR(`<span class="ind">ㄴ 런칭 대기 (월말)</span>`,C.SM.queue,"sub"):""}
    ${rowR("제작 회차 수",C.tot.eps.map(v=>Math.round(v)),"tot")}
    ${P.groups.map(G=>rowR(`<span class="ind">ㄴ ${esc(G.id)}</span>`,C.R.eps[G.id].map(v=>Math.round(v)),"sub")).join("")}
    ${rowR(`<span class="ai">그중 AI 성우 회차</span>`,C.tot.epsAi.map(v=>Math.round(v)),"tot aie")}
    ${P.groups.map(G=>rowR(`<span class="ind ai">ㄴ ${esc(G.id)}</span>`,C.R.epsAi[G.id].map(v=>Math.round(v)),"sub ai")).join("")}
  </tbody></table></div>`;
  // ── 레버 (노란 칸) ──
  const leadNote=(line,bd)=>`인간 ${lp2Lead(line,"human",bd,g)}주 · AI ${lp2Lead(line,"ai",bd,g)}주`;
  h+=`<div class="lpsec" style="margin-top:16px">레버 · 제작 착수 작품 수 <span class="hint">노란 칸 입력 · 드래그로 여러 칸 선택 후 숫자+Enter · Ctrl/⌘+C·V</span></div><textarea id="lpKey" class="lpkey" aria-label="선택한 칸 입력"></textarea>
  <div class="card lpg"><div class="lpops" style="margin:0">
    <label>시즌 화수<input class="in n lpi" type="number" min="5" max="100" data-g2="season" value="${g.season}"${ro?" disabled":""}></label>
    <label>런칭 시 공개 화수<input class="in n lpi" type="number" min="1" max="10" data-g2="openK" value="${g.openK}"${ro?" disabled":""}></label>
    <label>착수→런칭 주수<select class="in lpi" data-g2="leadSrc"${ro?" disabled":""}><option value="excel"${g.leadSrc==="excel"?" selected":""}>엑셀 표 (기본 · 5일 13/19주 · 7일 26/32주)</option><option value="auto"${g.leadSrc==="auto"?" selected":""}>공정 기준 탭 자동 (실제 공정)</option></select></label>
    <label>실제 런칭 (월 편수)<select class="in lpi" data-g2s="smooth"${ro?" disabled":""}>${[["auto","자동 평준화 (월 런칭이 줄지 않게)"],["off","준비되는 대로 바로"],...[2,3,4,5,6,7,8,9,10,12,14,16].map(n=>[String(n),`월 최대 ${n}편`])].map(([v,l])=>`<option value="${v}"${String(g.smooth??"auto")===v?" selected":""}>${l}</option>`).join("")}</select></label>
    <label>외부 추가 소요<span><input class="in n lpi" type="number" min="0" max="30" data-g2="extExtra" value="${g.extExtra}"${ro?" disabled":""}> 영업일</span></label>
    <label>외주 1곳 동시 제작<select class="in lpi" data-g2v="vcap"${ro?" disabled":""}>${[1,2,3,4,5].map(n=>`<option value="${n}"${lp2Cap(g)===n?" selected":""}>최대 ${n}편</option>`).join("")}</select></label>
    ${ro?"":`<button type="button" class="btn" id="lpRepack" style="padding:3px 10px;font-size:12px;align-self:flex-end" title="외주 착수를 동시 제작 상한에 맞게 제작사에 다시 나눠요">제작사 다시 배정</button>`}
    <label class="lpyn" title="기본은 꺼짐: 영업일 단축에 AI 성우 공정이 포함된 것으로 봄"><input type="checkbox" data-g2c="noAI5"${g.noAI5?" checked":""}${ro?" disabled":""}> 5영업일 이하는 AI 성우 제외</label>
    <span class="hint lpleads">7일 기준 · 내부 ${leadNote("int",7)} / 외부 ${leadNote("ext",7)}<br>5일 기준 · 내부 ${leadNote("int",5)} / 외부 ${leadNote("ext",5)}</span>
  </div></div>`;
  // ── 레버: 엑셀처럼 파이프라인마다 3줄 (착수 / 영업일 / AI 성우) ──
  const nCols=M.length;
  let lv=`<tr class="lsum"><td class="tl" colspan="2" data-tip="모든 팀·제작사의 월별 착수 편수 합계예요.">제작 착수 작품 수 <span class="hint" style="font-weight:400">합계</span></td>${M.map((m,i)=>`<td class="${yb(i)}${C.tot.start[i]?"":" z"}">${C.tot.start[i]||"–"}</td>`).join("")}</tr>`;
  P.groups.forEach((G,gi)=>{ const sum=M.map(m=>G.pipes.reduce((a,p)=>a+(+((p.start||{})[m])||0),0));
    lv+=`<tr class="lgh"><td class="tl" colspan="2"><b>${esc(G.id)}</b> <span class="ln ${G.line}" style="font-size:10px;padding:0 5px">${G.line==="ext"?"외부":"내부"}</span>${!ro?` <button type="button" class="lpadd" data-addp="${gi}">${G.line==="ext"?"+ 제작사":"+ 파이프라인"}</button>`:""}${G.line==="ext"?` <span class="hint" title="제작사 1곳은 동시에 최대 ${lp2Cap(g)}편까지 제작해요 (착수~30화 영상 1차 완료까지)">${G.pipes.length}곳 · 동시 ${lp2Cap(g)}편</span>`:""}</td>
      ${M.map((m,i)=>`<td class="${yb(i)}${sum[i]?"":" z"}">${sum[i]||""}</td>`).join("")}</tr>`;
    G.pipes.forEach((p,pi)=>{
      const LD=G.line==="ext"?lp2Load(p,g):null, CAP=lp2Cap(g);
      const cell=(kind,m,i)=>{ const n=+((p.start||{})[m])||0;
        if(kind==="start"){ const ov=LD&&LD[i]>CAP; return `<td class="${yb(i)} yc${ov?" ovc":""}"${LD&&LD[i]?` title="이 달 동시 제작 ${LD[i]}편${ov?` — 상한 ${CAP}편 초과`:""}"`:""}><input class="lp2c" data-c="start:${gi}:${pi}:${m}" value="${n||""}"${ro?" disabled":""}></td>`; }
        if(!n) return `<td class="${yb(i)} nc"></td>`;
        if(kind==="bd"){ const raw=(p.bd||{})[m], has=raw!==undefined&&raw!==""&&raw!==null, e=lp2ff(p.bd,i,7);
          return `<td class="${yb(i)} yc"><input class="lp2c${has?"":" inh"}" data-c="bd:${gi}:${pi}:${m}" value="${has?esc(raw):""}" placeholder="${e}"${ro?" disabled":""}></td>`; }
        const lock=g.noAI5&&lp2ff(p.bd,i,7)<=5, an=lock?0:lp2AiN(p,m,i);
        return `<td class="${yb(i)} yc${lock?" lk":""}"><input class="lp2c ai" data-c="aiN:${gi}:${pi}:${m}" value="${an}"${ro||lock?" disabled":""} title="${lock?"5영업일 이하라 AI 제외":`착수 ${n}편 중 AI`}"></td>`; };
      lv+=`<tr class="p1"><td class="tl pn" rowspan="3">${!ro?`<input class="lp2n" data-pn="${gi}:${pi}" value="${esc(p.name)}">`:`<b>${esc(p.name)}</b>`}${!ro&&G.pipes.length>1?`<button type="button" class="vdel" data-delp="${gi}:${pi}" title="삭제">✕</button>`:""}</td><td class="tl2" data-tip="그 달에 새로 착수하는 작품(시즌) 편수예요. 1이면 그 달 새 작품 1편이 제작에 들어가요.">착수 (편)</td>${M.map((m,i)=>cell("start",m,i)).join("")}</tr>
        <tr class="p2"><td class="tl2" data-tip="회차당 영상 1차 제작 영업일이에요. 비우면 왼쪽 값을 이어서 써요.">영업일 (일)</td>${M.map((m,i)=>cell("bd",m,i)).join("")}</tr>

  const mh2=`<tr><th class="tl" colspan="2"></th>${M.map((m,i)=>`<th class="${yb(i)}${m===key(TODAY).slice(0,7)?" now":""}">${m.slice(2,4)}.${+m.slice(5)}</th>`).join("")}</tr>`;
  h+=`<div class="card" style="padding:0;overflow-x:auto"><table class="lp2 lev2"><colgroup><col style="width:120px"><col style="width:90px">${M.map(()=>`<col style="width:48px">`).join("")}</colgroup><thead>${mh2}</thead><tbody>${lv}</tbody></table></div>`;
  // ── 외주 제작사 발굴 계획: 제작사마다 첫 착수월 − N개월까지 발굴(샘플 제작·계약) 끝내야 함 ──
  const LEADM=Math.max(0,+(g.srcLead??3)), curI=M.indexOf(key(TODAY).slice(0,7));

  const EXT=P.groups.filter(G=>G.line==="ext");
  const src={}, first={}, late={}; EXT.forEach(G=>{ src[G.id]=Array(M.length).fill(0); first[G.id]=Array(M.length).fill(0); late[G.id]=0; });
  EXT.forEach(G=>G.pipes.forEach(p=>{ const fm=Object.keys(p.start||{}).filter(m=>+p.start[m]>0).sort()[0]; if(!fm) return;
    const fi=M.indexOf(fm); if(fi>=0) first[G.id][fi]++;
    let di=M.indexOf(addM(fm,-LEADM)); if(addM(fm,-LEADM)<M[0]) di=0; if(curI>=0&&di<curI){ late[G.id]++; di=curI; } if(di>=0&&di<M.length) src[G.id][di]++; }));
  const srcT=M.map((_,i)=>EXT.reduce((a,G)=>a+src[G.id][i],0)), firstT=M.map((_,i)=>EXT.reduce((a,G)=>a+first[G.id][i],0));
  let cumS=0; const cumSrc=srcT.map(v=>cumS+=v); const lateT=EXT.reduce((a,G)=>a+late[G.id],0);
  const haveV=(typeof VENDORS!=="undefined"?VENDORS:[]).filter(v=>vKind(v)==="video"&&["sampleC","sampleP","sampleD","deal","signed","prod"].includes(v.stage)).length;
  const rowS=(lab,arr,cls,tip)=>`<tr class="${cls||""}"><td class="tl"${tip?` data-tip="${esc(tip)}"`:""}>${lab}${tip?`<span class="tipi">?</span>`:""}</td>${arr.map((v,i)=>`<td class="${yb(i)}${v?"":" z"}${cls&&cls.includes("srcr")&&i===curI&&lateT?" badc":""}">${v||"–"}</td>`).join("")}</tr>`;
  h+=`<div class="lpsec" style="margin-top:18px">외주 제작사 발굴 계획 <span class="hint">제작사마다 첫 착수 ${LEADM}개월 전까지 발굴 (샘플 제작·계약)</span>
      <label class="hint" style="display:flex;align-items:center;gap:4px">발굴 리드타임<input class="in n lpi" style="width:48px;min-height:24px" type="number" min="0" max="12" data-g2="srcLead" value="${LEADM}"${ro?" disabled":""}>개월</label></div>
    <div class="card" style="padding:0;overflow-x:auto"><table class="lp2 res src"><colgroup><col style="width:210px">${M.map(()=>`<col style="width:48px">`).join("")}</colgroup><thead>${mh}</thead><tbody>
      ${rowS("발굴 필요 제작사 수",srcT,"tot srcr",`이 달까지 새로 찾아서 샘플·계약을 끝내야 하는 외주 제작사 수예요 (첫 착수 ${LEADM}개월 전 기준).${lateT?` 이미 기한이 지난 ${lateT}곳은 이번 달에 모아 표시했어요.`:""}`)}
      ${EXT.map(G=>rowS(`<span class="ind">ㄴ ${esc(G.id)}</span>`,src[G.id],"sub srcr")).join("")}
      ${rowS("누적 필요 제작사",cumSrc,"sub","지금까지 확보해 둬야 하는 외주 제작사 누적 수예요.")}
      ${rowS("첫 착수 시작 제작사",firstT,"sub","그 달에 처음으로 작품 착수를 시작하는 제작사 수예요.")}
    </tbody></table></div>
    <p class="hint" style="margin:6px 0 0">총 ${EXT.reduce((a,G)=>a+G.pipes.filter(p=>Object.keys(p.start||{}).length).length,0)}곳 필요 (외주 1곳 동시 ${lp2Cap(g)}편 기준)${lateT?` · <b style="color:var(--bad)">기한 지난 ${lateT}곳 — 지금 바로 발굴 필요</b>`:""} · 외주사 관리 탭에서 샘플 계약 이상 진행 중인 영상 외주 <b>${haveV}곳</b></p>`;
  // ── 비용 (AOP) ──
  const CO=lp2Cost(P,C), k=CO.k, U=LP2V.unit||1, UL={1:"원",1000:"천원",1000000:"백만원"}[U];
  const fmtW=(v)=>v?Math.round(v/U).toLocaleString("ko-KR"):"–";
  const ci=(f,lab)=>`<label>${lab}<span><input class="in n lpi" style="width:96px" type="number" step="10000" data-cost="${f}" value="${k[f]}"${ro?" disabled":""}> 원/분</span></label>`;
  h+=`<div class="lpsec" style="margin-top:18px">제작비 (AOP) <span class="seg sm">${[[1,"원"],[1000,"천원"],[1000000,"백만원"]].map(([u,l])=>`<button type="button" data-unit="${u}" aria-pressed="${U===u}">${l}</button>`).join("")}</span>
      <button type="button" class="btn" id="lpCopy" style="padding:3px 10px;font-size:12px">엑셀로 복사</button></div>
    <div class="card lpg"><div class="lpops" style="margin:0">
      <label>회차 길이<span><input class="in n lpi" style="width:56px" type="number" step="0.5" data-cost="min" value="${k.min}"${ro?" disabled":""}> 분</span></label>
      ${ci("intVideo","내부 영상 제작")}${ci("extVideo","외주 영상 제작")}${ci("voiceHu","사람 성우")}${ci("voiceAi","AI 성우")}${ci("sub","자막 번역")}
      <label class="lpyn"><input type="checkbox" data-costc="extSub"${k.extSub?" checked":""}${ro?" disabled":""}> 외주에 자막 번역 포함</label>
    </div></div>
    <div class="card" style="padding:0;overflow-x:auto"><table class="lp2 res cost" id="lpCostT"><thead><tr><th class="tl">${UL}</th>${M.map((m,i)=>`<th class="${yb(i)}">${m.slice(2,4)}.${+m.slice(5)}</th>`).join("")}<th>합계</th></tr></thead><tbody>
      ${CO.rows.map(([lab,arr,cls])=>`<tr class="${cls||""}"><td class="tl">${lab}</td>${arr.map((v,i)=>`<td class="${yb(i)}${v?"":" z"}">${fmtW(v)}</td>`).join("")}<td class="sum">${fmtW(arr.reduce((a,b)=>a+b,0))}</td></tr>`).join("")}
      ${[2027,2028].map(y=>{ const ix=M.map((m,i)=>m.startsWith(String(y))?i:-1).filter(i=>i>=0); const all=CO.rows[5][1]; return `<tr class="yr"><td class="tl">${y}년 합계</td><td colspan="${M.length+1}" style="text-align:left;padding-left:10px"><b>${fmtW(ix.reduce((a,i)=>a+all[i],0))}</b> ${UL} · 내부 ${fmtW(ix.reduce((a,i)=>a+CO.rows[3][1][i],0))} · 외주 ${fmtW(ix.reduce((a,i)=>a+CO.rows[4][1][i],0))}</td></tr>`; }).join("")}
    </tbody></table></div>`;
  $("v-lp").innerHTML=h;
  // ── 이벤트 ──
  const set=(fn)=>lpSet(fn);
  document.querySelectorAll("#v-lp [data-g2]").forEach(el=>el.onchange=()=>set(P=>{ const k=el.dataset.g2; P.g[k]=k==="leadSrc"?el.value:(+el.value||0); }));
  document.querySelectorAll("#v-lp [data-g2v]").forEach(el=>el.onchange=()=>{ const v=+el.value; lpOp({op:"cur",v:lp2Repack({...clone(LP.cur),g:{...LP.cur.g,vcap:v}})}); toast(`외주 1곳 동시 ${v}편 기준으로 제작사를 다시 배정했어요`); render(); });
  if($("lpRepack")) $("lpRepack").onclick=()=>{ lpOp({op:"cur",v:lp2Repack(LP.cur)}); toast("제작사를 다시 배정했어요"); render(); };
  document.querySelectorAll("#v-lp [data-g2s]").forEach(el=>el.onchange=()=>set(P=>{ P.g.smooth=el.value==="auto"||el.value==="off"?el.value:+el.value; }));
  document.querySelectorAll("#v-lp [data-g2c]").forEach(el=>el.onchange=()=>set(P=>{ P.g[el.dataset.g2c]=el.checked; }));
  document.querySelectorAll("#v-lp [data-tg]").forEach(el=>el.onchange=()=>set(P=>{ P.targets.onair=P.targets.onair||{}; const v=parseInt(el.value,10); if(el.value!==""&&v>=0) P.targets.onair[el.dataset.tg]=v; else delete P.targets.onair[el.dataset.tg]; }));
  document.querySelectorAll("#v-lp [data-c]").forEach(el=>{ el.onchange=()=>set(P=>lp2SetCell(P,el.dataset.c,el.value)); });
  lp2GridBind();
  // 결과 표와 레버 표 가로 스크롤 맞추기 (월 칸이 위아래로 같은 자리)
  const wraps=[...document.querySelectorAll("#v-lp table.lp2.res:not(.cost),#v-lp table.lp2.lev2")].map(t=>t.parentElement); let syncing=false;
  wraps.forEach(w=>w.addEventListener("scroll",()=>{ if(syncing) return; syncing=true; wraps.forEach(o=>{ if(o!==w) o.scrollLeft=w.scrollLeft; }); syncing=false; }));
  document.querySelectorAll("#v-lp [data-pn]").forEach(el=>el.onchange=()=>set(P=>{ const [gi,pi]=el.dataset.pn.split(":"); P.groups[+gi].pipes[+pi].name=el.value.trim()||"파이프라인"; }));
  document.querySelectorAll("#v-lp [data-addp]").forEach(b=>b.onclick=()=>set(P=>{ const G=P.groups[+b.dataset.addp]; const n=P.groups.reduce((a,x)=>a+x.pipes.filter(p=>/^외부\d+$/.test(p.name)).length,0);
      const mx=P.groups.reduce((a,x)=>Math.max(a,...x.pipes.map(p=>{ const r=/^외부(\d+)$/.exec(p.name); return r?+r[1]:0; })),0);
      G.pipes.push({id:"p"+Date.now().toString(36),name:G.line==="ext"?`외부${mx+1}`:`${G.id}-${G.pipes.length+1}`,start:{},bd:{...(G.pipes[0]||{}).bd},aiN:{}}); }));
  document.querySelectorAll("#v-lp [data-delp]").forEach(b=>b.onclick=()=>{ const [gi,pi]=b.dataset.delp.split(":"); const p=LP.cur.groups[+gi].pipes[+pi];
    if(confirm(`'${p.name}' 파이프라인을 지울까요? 이 줄의 착수·영업일·AI 값도 같이 지워져요.`)) set(P=>{ P.groups[+gi].pipes.splice(+pi,1); }); });
  document.querySelectorAll("#v-lp [data-fill]").forEach(b=>b.onclick=()=>set(P=>{ const [k,gi,pi]=b.dataset.fill.split(":"); const p=P.groups[+gi].pipes[+pi]; p[k]=p[k]||{};
      let last; LP2_M.forEach(m=>{ const v=p[k][m]; if(v!==undefined&&v!==""&&v!==null) last=v; else if(last!==undefined) p[k][m]=last; }); }));
  if($("lpCurve")) $("lpCurve").onclick=()=>{ if(!confirm("엑셀 기존 계획의 월별 연재 작품 수(27.2부터 1·3·6·9…28.12 100)를 '연재 목표' 줄에 채울까요?")) return;
    set(P=>{ P.targets.onair={}; Object.entries(LP2_PLAN_CURVE).forEach(([m,v])=>{ if(m>=key(TODAY).slice(0,7)&&v!=null) P.targets.onair[m]=v; }); }); };
  if($("lpSolve")) $("lpSolve").onclick=()=>{ const btn=$("lpSolve"); btn.disabled=true; btn.textContent="계산 중…"; setTimeout(()=>{
    const r=lp2Solve(LP.cur), M=LP2_M, T=LP.cur.targets.onair||{}, before=lp2Quick(LP.cur), after=lp2Quick(r.P);
    const line=(Q)=>Object.keys(T).sort().map(m=>`${m.slice(2,4)}.${+m.slice(5)} ${Q.on[M.indexOf(m)]}/${T[m]}`).join(" · ");
    const pc=(P)=>P.groups.filter(G=>G.line==="ext").reduce((a,G)=>a+G.pipes.length,0);
    if(!r.add&&!r.rm&&!r.mv){ toast("이미 목표와 같거나, 바꿀 수 있는 착수가 없어요"); render(); return; }
    if(!confirm(`목표 대비: ${line(after)}\n(지금: ${line(before)})\n\n착수 ${before.works.length} → ${after.works.length}편 (추가 ${r.add} · 삭제 ${r.rm} · 한 달 당김 ${r.mv})\n외주 제작사 ${pc(LP.cur)} → ${pc(r.P)}곳\n\n적용할까요? 지금 값은 자동 보관돼요.`)){ render(); return; }
    lpOp({op:"hadd",v:{id:"h"+Date.now().toString(36),name:`역산 전 자동 보관 (${md(TODAY)})`,by:lpWho(),at:new Date().toISOString(),plan:clone(LP.cur)}});
    lpOp({op:"cur",v:r.P}); toast("목표에 맞춰 조정했어요"); render(); },30); };
  if($("lpTrim")) $("lpTrim").onclick=()=>{ const btn=$("lpTrim"); btn.disabled=true; btn.textContent="계산 중…"; setTimeout(()=>{
    const r=lp2Trim(LP.cur), M=LP2_M, T=LP.cur.targets.onair||{}, before=lp2Quick(LP.cur), after=lp2Quick(r.P);
    const line=(Q)=>Object.keys(T).sort().map(m=>`${m.slice(2,4)}.${+m.slice(5)} ${Q.on[M.indexOf(m)]}/${T[m]}`).join(" · ");
    if(!r.removed){ toast("줄일 착수가 없어요 (이미 목표 이하이거나 앞선 목표가 깨져요)"); render(); return; }
    const tot=(Q)=>Q.works.length;
    if(!confirm(`착수 ${r.removed}편을 줄이면 (AI ${r.removedAi}편 포함)\n착수 ${tot(before)} → ${tot(after)}편 · 외주 제작사 ${r.pipesBefore} → ${r.pipesAfter}곳\n\n목표 대비: ${line(after)}\n(지금: ${line(before)})\n\n적용할까요? 지금 값은 자동 보관돼요.`)){ render(); return; }
    lpOp({op:"hadd",v:{id:"h"+Date.now().toString(36),name:`착수 줄이기 전 자동 보관 (${md(TODAY)})`,by:lpWho(),at:new Date().toISOString(),plan:clone(LP.cur)}});
    lpOp({op:"cur",v:r.P}); toast(`착수 ${r.removed}편을 줄였어요`); render(); },30); };
  if($("lpFit")) $("lpFit").onclick=()=>{ const btn=$("lpFit"); btn.disabled=true; btn.textContent="계산 중…"; setTimeout(()=>lp2FitRun(),30); };
  const lp2FitRun=()=>{ const before=lp2Compute(LP.cur), r=lp2Fit(LP.cur), after=lp2Compute(r.P), M=LP2_M, T=LP.cur.targets.onair||{};
    const gap=(C)=>M.reduce((a,m,i)=>a+(T[m]!=null?Math.abs(C.tot.onair[i]-T[m]):0),0);
    if(!r.moved){ toast("옮길 수 있는 착수가 없거나 이미 목표와 같아요"); render(); return; }
    if(!confirm(`착수 ${r.moved}건을 한 달씩 옮기면 목표와의 차이가 ${gap(before)} → ${gap(after)}로 줄어요. 적용할까요?\n(영업일·AI 성우 편수·착수 총량은 그대로, 지난 달 착수는 그대로예요)`)){ render(); return; }
    lpOp({op:"hadd",v:{id:"h"+Date.now().toString(36),name:`역산 전 자동 보관 (${md(TODAY)})`,by:lpWho(),at:new Date().toISOString(),plan:clone(LP.cur)}});
    lpOp({op:"cur",v:r.P}); toast(`착수 ${r.moved}건을 옮겼어요`); render(); };
  document.querySelectorAll("#v-lp [data-cost]").forEach(el=>el.onchange=()=>set(P=>{ P.cost={...LP2_COST0,...(P.cost||{})}; P.cost[el.dataset.cost]=+el.value||0; }));
  document.querySelectorAll("#v-lp [data-costc]").forEach(el=>el.onchange=()=>set(P=>{ P.cost={...LP2_COST0,...(P.cost||{})}; P.cost[el.dataset.costc]=el.checked; }));
  document.querySelectorAll("#v-lp [data-unit]").forEach(b=>b.onclick=()=>{ LP2V.unit=+b.dataset.unit; render(); });
  if($("lpCopy")) $("lpCopy").onclick=()=>{ const t=$("lpCostT"); const tsv=[...t.querySelectorAll("tr")].filter(r=>!r.classList.contains("yr")).map(r=>[...r.children].map(c=>c.innerText.replace(/,/g,"").replace("–","0").trim()).join("\t")).join("\n");
    const done=()=>toast("표를 복사했어요. 엑셀에 붙여넣으세요"); if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(done,()=>{ prompt("아래 내용을 복사하세요",tsv); }); else prompt("아래 내용을 복사하세요",tsv); };
  document.querySelectorAll("#v-lp [data-gopen]").forEach(b=>b.onclick=()=>{ LP2V.open=LP2V.open||{}; const k=b.dataset.gopen; LP2V.open[k]=LP2V.open[k]===false; render(); });
  document.querySelectorAll("#v-lp [data-aic]").forEach(b=>b.onclick=()=>set(P=>{ const [gi,pi,m,j]=b.dataset.aic.split(":"); const p=P.groups[+gi].pipes[+pi]; p.aiN=p.aiN||{};
      const i=LP2_M.indexOf(m), n=+((p.start||{})[m])||0, cur=lp2AiN(p,m,i); p.aiN[m]=Math.max(0,Math.min(n,(+j<cur)?cur-1:cur+1)); }));
  document.querySelectorAll("#v-lp [data-rng]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const [gi,pi]=b.dataset.rng.split(":").map(Number); const G=LP.cur.groups[gi], p=G.pipes[pi];
    const pop=vPopAt(b,`<h4>${esc(p.name)} · 구간 설정</h4><p class="ps">고른 달부터 끝까지 한 번에 바꿔요</p>
      <div class="row"><span>시작 달</span><select class="in" id="rgM">${LP2_M.map(m=>`<option value="${m}"${m===key(TODAY).slice(0,7)?" selected":""}>${m.slice(2,4)}.${+m.slice(5)}</option>`).join("")}</select></div>
      <div class="row"><span>영업일</span><input class="in n" id="rgB" type="number" min="3" max="15" placeholder="그대로"> <span class="hint" style="width:auto">일</span></div>
      <div class="row"><span>성우</span><select class="in" id="rgA"><option value="">그대로</option><option value="all">전부 AI 성우</option><option value="none">전부 인간 성우</option><option value="half">절반 AI (내림)</option></select></div>
      <div class="row"><span>적용 범위</span><select class="in" id="rgS"><option value="p">이 파이프라인</option><option value="g">${esc(G.id)} 전체</option><option value="all">모든 팀</option></select></div>
      <div class="acts"><button type="button" class="btn" id="rgX">닫기</button><button type="button" class="btn pri" id="rgOk">적용</button></div>`);
    $("rgX").onclick=closePop;
    $("rgOk").onclick=()=>{ const m0=$("rgM").value, bd=$("rgB").value, ai=$("rgA").value, sc=$("rgS").value; closePop();
      set(P=>{ const targets=sc==="p"?[P.groups[gi].pipes[pi]]:sc==="g"?P.groups[gi].pipes:P.groups.flatMap(x=>x.pipes);
        targets.forEach(q=>{ q.bd=q.bd||{}; q.aiN=q.aiN||{};
          if(bd!==""){ const v=Math.max(3,Math.min(15,+bd)); LP2_M.forEach(m=>{ if(m>m0) delete q.bd[m]; }); q.bd[m0]=v; }
          if(ai) LP2_M.forEach(m=>{ if(m<m0) return; const n=+((q.start||{})[m])||0; if(!n) return; q.aiN[m]=ai==="all"?n:ai==="none"?0:Math.floor(n/2); }); }); }); }; });
  if($("lpBase")) $("lpBase").onclick=()=>{ if(!confirm("엑셀 시뮬레이터 기본값(착수·영업일·AI·계산 방식)으로 되돌릴까요? 지금 값은 자동 보관돼요.")) return;
    lpOp({op:"hadd",v:{id:"h"+Date.now().toString(36),name:`엑셀 기본값으로 되돌리기 전 (${md(TODAY)})`,by:lpWho(),at:new Date().toISOString(),plan:clone(LP.cur)}});
    const seed=lp2Repack(lp2Seed()); seed.cost=LP.cur.cost; lpOp({op:"cur",v:seed}); toast("엑셀 기본값으로 되돌렸어요"); render(); };
  if($("lpUndo")) $("lpUndo").onclick=(e)=>{ e.stopPropagation(); lpUndoMenu(e.currentTarget); };
  if($("lpHist")) $("lpHist").onclick=()=>{ LPV.showHist=!LPV.showHist; render(); };
  if($("lpSnap")) $("lpSnap").onclick=()=>{ const nm=prompt("기록 이름 (예: 10/15 리드 보고)",`${md(TODAY)} 기록`); if(!nm) return;
    lpOp({op:"hadd",v:{id:"h"+Date.now().toString(36),name:nm.trim(),by:lpWho(),at:new Date().toISOString(),plan:clone(LP.cur)}}); LPV.showHist=true; toast("기록을 남겼어요"); render(); };
  if($("lpBack")) $("lpBack").onclick=()=>{ LPV.peek=null; render(); };
  if($("lpRestore")) $("lpRestore").onclick=()=>{ const pk=LPV.peek; if(!confirm(`'${pk.name}'으로 현재 버전을 되돌릴까요? 지금 현재 버전은 기록으로 먼저 남겨둘게요.`)) return;
    lpOp({op:"hadd",v:{id:"h"+Date.now().toString(36),name:`되돌리기 전 자동 기록 (${md(TODAY)})`,by:lpWho(),at:new Date().toISOString(),plan:clone(LP.cur)}});
    lpOp({op:"cur",v:clone(pk.plan)}); LPV.peek=null; toast("현재 버전을 되돌렸어요"); render(); };
  document.querySelectorAll("#v-lp [data-hpeek]").forEach(b=>b.onclick=()=>{ const x=(LP.hist||[]).find(h=>h.id===b.dataset.hpeek); LPV.peek=x?{id:x.id,name:x.name,plan:x.plan}:null; render(); });
  document.querySelectorAll("#v-lp [data-hdel]").forEach(b=>b.onclick=()=>{ const x=(LP.hist||[]).find(h=>h.id===b.dataset.hdel); if(x&&confirm(`'${x.name}' 기록을 지울까요?`)){ if(LPV.peek&&LPV.peek.id===x.id) LPV.peek=null; lpOp({op:"hdel",id:x.id}); render(); } });
}

/* ---------- 탭 · 시작 ---------- */
function setTab(t){
  TAB=t; $("pop").hidden=true;
  render(); window.scrollTo(0,0);
  try{   // 미리보기·file:// 등 일부 환경은 주소 변경을 막으므로 실패해도 무시
    const u=new URL(location.href); u.searchParams.set("tab",t);
    if(t==="prod"&&SEL) u.searchParams.set("w",SEL); else u.searchParams.delete("w");
    history.replaceState(null,"",u.toString());
  }catch(e){}
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
document.querySelectorAll("#langSw [data-lang]").forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.lang!==LANG) setLang(b.dataset.lang); }));
document.querySelectorAll("#langSw [data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG)));
$("txSw").addEventListener("click",()=>{ TX_ON=!TX_ON; try{ localStorage.setItem("anime_autotx",TX_ON?"1":"0"); }catch(e){} render(); });
if(LANG==="ja"){ document.documentElement.lang="ja"; document.title="アニメ公開スケジュール"; }
TR_OBS.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["title","placeholder","aria-label"]});
(async function init(){
  try{ const q=new URLSearchParams(location.search);
    if(["open","prod","std","lp","sim","vendors","users"].includes(q.get("tab"))) TAB=q.get("tab");
    if(q.get("w")) SEL=q.get("w"); }catch(e){}
  if(!SB.on){
    WORKS=clone(DEFAULT_WORKS).map(normW); VENDORS=vApplyUpd1015(vActMigrate(clone(V_SEED)));
    setSync("off","공유 저장소 미설정 — 고친 내용이 이 창에만 남습니다");
    runMigrations(); render(); return;
  }
  if(AUTH_REQUIRED){ setSync("busy","로그인 확인 중…"); if(!(await authStart())) return; }
  setSync("busy","공유 저장소 불러오는 중…"); render();
  try{
    const r=await pullAll(true);
    if(r.empty){ WORKS=clone(DEFAULT_WORKS).map(normW); CONF=normConf(DEFAULT_CONF); setHol(CONF.hol); }
    await runMigrations();
    setSync("on",`공유 중 · ${hhmm()} 불러옴`);
  }catch(e){ console.error("Supabase 연결 오류:",e); if(!WORKS.length) WORKS=clone(DEFAULT_WORKS).map(normW); const [t,tip]=errMsg(e); setSync("err",`공유 저장소 연결 실패 — ${t}`,tip); }
  render();
  const tick=async()=>{ try{ const r=await pullAll(false); if(r.changed) safeRender(); if(!Object.values(PENDING).some(a=>a.length)) setSync("on",`공유 중 · ${hhmm()} 확인`);}catch(e){ const [t,tip]=errMsg(e); setSync("err",`공유 저장소 연결 끊김 — ${t}`,tip); } };
  setInterval(tick,POLL_MS);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });
})();
</script>
