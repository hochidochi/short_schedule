<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애니메이션 오픈 일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --page:#F1F2EE; --surface:#FFFFFF; --ink:#16191D; --ink2:#474C53; --muted:#868B91;
  --line:#E1E3DD; --line2:#C9CCC5;
  --launch:#1E48C8; --serial:#D7E0FA; --serial-ink:#1E3A8A; --prod:#E7E8E2;
  --warn:#B97C06; --warn-bg:#FCEFCF; --bad:#C4362E; --bad-bg:#FBE2DF; --good:#1F7A50; --good-bg:#DDF0E5;
  --ai:#5B45D6; --ai-bg:#E9E5FB; --now:#F2C230;
  /* 제작 라인: 내부 = 하늘색, 외부 = 주황 (같은 명도·채도 톤) */
  --int:#2B8FCC; --int-bg:#D6ECF8; --int-ink:#135B85; --int-prod:#E6F2F9;
  /* 휴재: 벽돌 붉은색 */
  --hia:#A8432C; --hia-bg:#E9C1B4; --hia-ink:#6E2718;
  --ext:#E07A2E; --ext-bg:#FBE3CF; --ext-ink:#8E4616; --ext-prod:#FBEEE3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-size:14px;line-height:1.5;
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--launch);outline-offset:1px}
[hidden]{display:none!important}

/* 상단 */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top-in{max-width:1680px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px}
.brand{padding-bottom:10px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-right:auto;align-items:stretch}
.tgrp{display:flex;gap:2px;border-radius:10px 10px 0 0;padding:0 4px}
.tgrp.tga{background:#EEF4FD} .tgrp.tgb{background:#EEF8F1} .tgrp.tgc{background:#F5F1FA}
.tgrp.tga button[aria-selected="true"]{color:#1F5FBF!important;border-bottom-color:#2F7FC1!important}
.tgrp.tgb button[aria-selected="true"]{color:#1F7A4D!important;border-bottom-color:#2E9B6A!important}
.tgrp.tgc button[aria-selected="true"]{color:#6B3FA0!important;border-bottom-color:#7F56C2!important}
.tabs button{border:0;background:none;padding:10px 14px 11px;font-size:14px;font-weight:600;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sync{font-size:12px;padding:4px 10px;border-radius:6px;margin-bottom:10px;background:var(--page);color:var(--ink2)}
.sync[data-s="on"]{background:var(--good-bg);color:var(--good)}
.sync[data-s="off"],.sync[data-s="busy"]{background:var(--warn-bg);color:var(--warn)}
.sync[data-s="err"]{background:var(--bad-bg);color:var(--bad)}

main{max-width:1680px;margin:0 auto;padding:20px 20px 80px}
h2{font-size:15px;font-weight:700;margin:28px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
.hint{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.vo{font-size:11px;font-weight:600;padding:0 6px;border-radius:4px}
.vo.human{background:var(--good-bg);color:var(--good)}
.vo.ai{background:var(--ai-bg);color:var(--ai)}

/* ── 오픈 일정 (리더용) ── */
.lead{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;line-height:1.4}
.lead-sub{font-size:13px;color:var(--ink2);margin:0}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mon{flex:none;min-width:190px;max-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mon .ml{font-size:12px;color:var(--muted)}
.mon .mn{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.03em;color:var(--launch)}
.mon .mn small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:4px;letter-spacing:0}
.mon ul{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
.mon li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-top:1px solid var(--line)}
.mon li span:last-child{color:var(--muted)}
.mon li.late span:last-child{color:var(--bad);font-weight:600}

.calwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:78vh}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px}
table.cal th,table.cal td{padding:0}
table.cal thead th{position:sticky;top:0;z-index:5;background:var(--surface)}
table.cal thead tr:nth-child(2) th{top:24px}
.cal .yr{height:24px;font-size:12px;font-weight:700;text-align:left;padding-left:8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line2)}
.cal .mh{height:26px;width:62px;min-width:62px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line2);border-left:1px solid var(--line)}
.cal .mh.now{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--now)}
.cal .rl{position:sticky;left:0;z-index:4;background:var(--surface);min-width:230px;max-width:230px;text-align:left;
  padding:6px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);font-weight:400}
thead .rl{z-index:7}
.cal .rl .nm{border:0;background:none;padding:0;font-weight:700;font-size:13px;cursor:pointer;text-align:left;
  display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .rl .nm:hover{text-decoration:underline}
.cal .rl .mt{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:11.5px;color:var(--muted)}
.cal td.c{height:44px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;vertical-align:middle;position:relative}
.cal td.c.now{box-shadow:inset 1px 0 0 var(--now),inset -1px 0 0 var(--now)}
.cal td.prod{background:repeating-linear-gradient(135deg,var(--lp,var(--prod)) 0 5px,#F7F7F4 5px 10px)}
tr.ln-int{--lc:var(--int);--ls:var(--int-bg);--li:var(--int-ink);--lp:var(--int-prod)}
tr.ln-ext{--lc:var(--ext);--ls:var(--ext-bg);--li:var(--ext-ink);--lp:var(--ext-prod)}
tr.ln-int .rl,tr.ln-ext .rl{box-shadow:inset 4px 0 0 var(--lc)}
.ln{display:inline-block;font-size:10.5px;font-weight:700;padding:0 5px;border-radius:4px;white-space:nowrap}
.ln.int{background:var(--int-bg);color:var(--int-ink)}
.ln.ext{background:var(--ext-bg);color:var(--ext-ink)}
.lnd{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;flex:none;vertical-align:0}
.lnd.int{background:var(--int)} .lnd.ext{background:var(--ext)}
.cal td.serial{background:var(--ls,var(--serial));color:var(--li,var(--serial-ink));font-weight:600}
.cal td.launch{background:var(--lc,var(--launch));color:#fff;font-weight:700;line-height:1.15}
.cal td.launch small,.cal td.serial small,.cal td.end small{display:block;font-size:10.5px;font-weight:500;opacity:.85}
.cal td.end{background:var(--ls,var(--serial));color:var(--li,var(--serial-ink));font-weight:700}
.cal tr.sum td.c{height:34px;font-size:15px;font-weight:700;background:var(--surface)}
.cal tr.sum td.c.z{color:var(--line2);font-weight:400;font-size:12px}
.cal tr.sum .rl{font-size:12px;color:var(--ink2);font-weight:600}
.cal tr.sum.first td,.cal tr.sum.first th{border-top:0}
.cal tr.sum.last td,.cal tr.sum.last th{border-bottom:1px solid var(--line2)}
.cal tr.sum td.hot{color:var(--launch)}
.calwrap.fit{overflow-x:auto}
table.cal.fit{width:100%;min-width:1880px;table-layout:fixed}
table.cal.fit col.rlc{width:224px}
.cal .rl .mt{white-space:nowrap}
.cal .rl .mt .vo{flex:none}
table.cal.fit .rl{min-width:0;max-width:none}
table.cal.fit .mh{width:auto;min-width:0;font-size:11.5px}
table.cal.fit td.launch{font-size:12px}
.cal .y1{border-left:2px solid var(--line2)!important}
.cal td.gap{box-shadow:inset 0 -4px 0 var(--hia)}
.cal td.gaponly{background:var(--hia-bg);color:var(--hia-ink);font-weight:700;font-size:11px}
table.std.cmp{max-width:none;background:var(--surface)}
table.std.cmp td{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;border-left:1px solid var(--line2);background:none;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.cal tr.sum td.low{background:var(--bad-bg);color:var(--bad)!important}
.staff .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600}
.staff ol{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.staff li{display:grid;grid-template-columns:24px minmax(120px,170px) 1fr auto;grid-template-areas:"rk nm st mv" ". nt nt nt";gap:2px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.staff li .rk{grid-area:rk} .staff li b{grid-area:nm} .staff li .st{grid-area:st} .staff li .mv{grid-area:mv;display:flex;gap:4px} .staff li .hint{grid-area:nt;font-size:11.5px}
.staff li.off{color:var(--muted)}
.staff li.off b{color:var(--ink2)}
.staff .rk{width:20px;height:20px;border-radius:50%;background:var(--page);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.staff li.on .rk{background:var(--int);color:#fff}
.staff .q:disabled{opacity:.3;cursor:default}
.tag.tbd{background:var(--warn-bg);color:var(--warn)}
.tag.pzt{background:#E4E5E1;color:var(--ink2)}
.cal td.pz{background:repeating-linear-gradient(135deg,#E1E2DD 0 4px,#EEEFEB 4px 8px);color:var(--ink2);font-size:11px;font-weight:700}
.pzbar{margin:14px 0 0;padding:9px 12px;border-radius:8px;background:#ECEDE9;border-left:4px solid var(--ink2);font-size:13px}
td.pzc{box-shadow:inset 0 3px 0 var(--ink2)}
.pzl{display:block;font-size:10px;font-weight:700;color:var(--ink2);padding:4px 22px 0 7px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;
  font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(720px,92vw)}
.cal tr.flash th.rl{background:#FFF6D6}
.cal tr.flash td.c{outline:0}
.cal tr.held th.rl{opacity:.85}
.epb{display:block;margin:2px auto 0;border:1px solid var(--line2);background:var(--surface);border-radius:4px;font-size:10px;font-weight:600;padding:0 5px;cursor:pointer;color:var(--ink2)}
td.ep .epb{opacity:.45} tr:hover td.ep .epb,td.ep .epb:focus-visible{opacity:1}
.epb:hover{border-color:var(--ink)}
.epz{display:block;font-size:9.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
tr.pzrow td{background:repeating-linear-gradient(135deg,#E1E2DD 0 5px,#EEEFEB 5px 10px);padding:10px 12px}
.pzl2{font-weight:700;color:var(--ink2);font-size:13px}
.vo.ai{background:var(--ai-bg);color:var(--ai)}
.cal td.cont{background:repeating-linear-gradient(90deg,var(--ls,var(--serial)) 0 3px,transparent 3px 7px);opacity:.8}
.cal td.wait{background:#EFEFEC}
.seg.sm button{padding:2px 9px;font-size:12px}
.epadd{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.epadd .sp{flex:1}
.epadd .btn:disabled{opacity:.4;cursor:default}
.age{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin-left:6px;border-radius:9px;
  font-size:10px;font-weight:800;color:#fff;vertical-align:1px;letter-spacing:-.02em;line-height:1}
.age.aall{background:#2E9B4E} .age.a12{background:#2F6FD0} .age.a15{background:#E0A11B} .age.a18{background:#D23A2F}
.wlist button.wi[aria-current="true"] .age{box-shadow:0 0 0 1.5px #fff}
body.locked main,body.locked .tabs{visibility:hidden}
.gate{position:fixed;inset:0;z-index:90;background:rgba(241,242,238,.96);display:flex;align-items:center;justify-content:center;padding:20px}
.gcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:0 20px 50px rgba(20,24,30,.12)}
.gt{margin:0 0 4px;font-size:18px}
.gs,.gm{font-size:13px;color:var(--ink2);margin:0 0 16px;line-height:1.6}
.gtabs{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-bottom:14px}
.gtabs button{flex:1;border:0;background:none;padding:8px;font-size:13px;cursor:pointer;color:var(--ink2)}
.gtabs button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.gf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);margin-bottom:10px}
.gf .in{min-height:36px;font-size:14px}
.gerr{min-height:18px;font-size:12.5px;color:var(--bad);margin:2px 0 10px}
.gacts{display:flex;gap:8px;flex-wrap:wrap}
.who{font-size:12px;color:var(--ink2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.simopt{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-end;padding:10px 14px}
.simopt label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.simopt .in{min-height:26px;padding:2px 6px;font-size:12.5px}
.simopt .sog{width:100%;font-size:11.5px;font-weight:700;color:var(--ink2);margin:4px 0 -2px;padding-top:6px;border-top:1px solid var(--line)}
.simopt .sog:first-child{border-top:0;padding-top:0;margin-top:0}
.simopt label.hl{color:var(--launch);font-weight:700}
.simopt label.hl .in{border-color:var(--launch)}
.dvi{font-size:12px;font-weight:600;color:var(--ink2);margin-left:2px}
.dv{display:block;font-size:9.5px;font-weight:700;color:var(--ink2);line-height:1}
.simv{margin:14px 0 0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--launch);border-radius:10px;font-size:15px}
.simv .hint{font-size:12.5px;margin-top:3px}
.cal td.srest{background:repeating-linear-gradient(90deg,#E9EAE5 0 3px,#F6F6F3 3px 6px);color:var(--muted);font-size:9.5px;line-height:1.1}
table.simt tr.off td{opacity:.45}
table.simt td{white-space:nowrap}
.simopt .sog{width:100%;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:-4px}
.simopt label.cb{justify-content:flex-end}
.simopt label.cb span{display:flex;gap:6px;align-items:center;color:var(--ink2);font-size:12.5px;min-height:30px}
.cal tr.needrow th.rl{background:#FFF8EC}
table.eg thead th.lenh,table.eg td.lenc{min-width:58px;background:#FBFBF9}
.lenin{width:52px;border:1px solid transparent;border-radius:5px;background:transparent;font:inherit;font-size:12.5px;font-weight:600;padding:4px 5px;text-align:center}
.lenin:hover{border-color:var(--line2)} .lenin:focus{border-color:var(--launch);background:#fff;outline:0}
.lenin::placeholder{color:var(--line2);font-weight:400}
.spdbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
table.spdsum tr{cursor:pointer} table.spdsum tr:hover td{background:#F7F8F5}
table.spdsum tr.on td{background:var(--serial);font-weight:600}
#langSw{margin-bottom:10px}
#txSw{margin-bottom:10px;padding:3px 10px;font-size:12px}
#txSw[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);background:var(--ai-bg)}
[data-tx].txd::after{content:attr(data-txl);margin-left:5px;font-size:9.5px;font-weight:700;color:var(--ai);background:var(--ai-bg);border-radius:3px;padding:0 4px;vertical-align:1px;white-space:nowrap;font-style:normal}
.vev [data-tx].txd::after{display:none}
#langSw button{padding:3px 10px;font-size:12px}
.card.today{margin-bottom:14px;padding:12px 16px}
.tdtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.tdtop .sp{flex:1}
.tdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px 16px;margin-top:8px}
.tdh{font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;display:inline-block;margin-bottom:4px}
.tdh.due{background:var(--serial);color:var(--serial-ink)} .tdh.doing{background:var(--good-bg);color:var(--good)} .tdh.late{background:var(--bad-bg);color:var(--bad)}
.today ul{list-style:none;margin:0;padding:0}
.today li{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:4px 0}
.tdgo{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;padding:2px 0;font-size:13px;line-height:1.35}
.tdgo:hover b{text-decoration:underline}
.tdgo .hint{display:block;font-size:11.5px}
.tdep{font-size:11.5px;font-weight:700;color:var(--ink2)} .tdst{font-size:12.5px;font-weight:600;color:var(--launch)}
.tdok{padding:2px 8px;font-size:12px;flex:none}
.cl.flashc{animation:flashc 2.2s ease}
@keyframes flashc{0%,60%{box-shadow:inset 0 0 0 3px var(--now);background:#FFF6D6}100%{}}
.vpipe{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;margin:10px 0}
.vflow{display:flex;flex:1;min-width:640px}
.vstep{position:relative;flex:1;display:flex;align-items:center;gap:6px;border:0;background:#E9EBE6;color:var(--ink2);padding:8px 10px 8px 22px;cursor:pointer;text-align:left;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);margin-left:-8px;min-width:0}
.vstep:first-child{margin-left:0;padding-left:12px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:8px 0 0 8px}
.vstep:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%);border-radius:0 8px 8px 0}
.vstep .vno{flex:none;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--ink2);font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.vstep .vtx{display:flex;flex-direction:column;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vstep .vtx b{font-size:16px;color:var(--ink)}
.vstep:not(.z){background:#D9E3F7} .vstep:not(.z) .vno{background:var(--launch);color:#fff}
.vstep.z{opacity:.6} .vstep.on{background:var(--launch);color:#fff} .vstep.on .vtx b{color:#fff} .vstep.on .vno{background:#fff;color:var(--launch)}
.vstep:hover{filter:brightness(.97)}
.vside{display:flex;gap:6px;align-items:stretch;padding-left:14px;border-left:2px dashed var(--line2)}
.vsl{font-size:11px;color:var(--muted);writing-mode:vertical-rl;letter-spacing:.1em;align-self:center}
.vsbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;border:1px dashed var(--line2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--ink2);cursor:pointer}

  .meter{ background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 28px 28px 20px; margin-bottom: 56px; }.dg .meter h2{ font-size: 17px; margin: 0 0 4px; }.dg .meter > p{ margin: 0 0 8px; color: var(--muted); font-size: 14px; }.dg .scale{ position: relative; height: 150px; margin: 0 8px; }.dg .scale .bar{ position: absolute; left: 0; right: 0; top: 68px; height: 14px; background: var(--track); border-radius: 7px; overflow: hidden; }.dg .scale .fill{

function processV2Patches(w,withB1){
  const ps=[];
  Object.keys(w.ov||{}).forEach(kk=>{ if(OLD_KEYS.includes(kk.split(":")[1])) ps.push({p:["ov",kk],del:true}); });
  const t=B1_TIMELINE.works.find(x=>x.n===w.n);
  if(t&&withB1){
    for(let k=1;k<=t.eps;k++) Object.entries(B1_TIMELINE.perEp).forEach(([sk,o])=>ps.push({p:["ov",`${k}:${sk}`],v:clone(o)}));
    Object.entries(B1_TIMELINE.batch).forEach(([sk,o])=>ps.push({p:["ov",`1:${sk}`],v:clone(o)}));
    Object.entries(B1_TIMELINE.work).forEach(([sk,o])=>ps.push({p:["ov",`w:${sk}`],v:clone(o)}));
  }
  const memo=SHEET_MEMO[w.n]||{};
  Object.entries(memo).forEach(([sk,m])=>{
    const isW=["contract","ratingFb","casting"].includes(sk);
    if(isW){ const kk=`w:${sk}`, cur=ps.filter(p=>p.p[1]===kk&&!p.del).pop();
      if(cur) cur.v.m=`${m} · ${cur.v.m}`; else ps.push({p:["ov",kk],v:{...((w.ov||{})[kk]||{}),m}}); }
    else{ const kk=`${(+w.done||0)+1}:${sk}`;   // 진행 중인 회차에 메모
      const target=t?`1:${sk}`:kk, cur=ps.filter(p=>p.p[1]===target&&!p.del).pop();
      if(cur) cur.v.m=`${m} · ${cur.v.m}`; else ps.push({p:["ov",target],v:{...((w.ov||{})[target]||{}),m}}); }
  });
  return ps;
}

  const earliest=(rest,pw,n)=>{ let L=dowOnOrAfter(addDays(TODAY,1),S.dow!=null?S.dow:1), P=null;

let TODAY_MORE=false, FOCUS=null;
function todayItems(){
  const t=TODAY, out=[];
  WORKS.forEach(w=>{ const S=schedule(w), N=S.held?(S.N0||0):S.N, seen=new Set();
    for(let k=1;k<=N;k++){ const E=S.eps[k]; if(!E) continue;
      S.ST.forEach(s=>{ const c=E.cells[s.k]; if(!c||c.skip||isOk(c)||s.k==="contract") return;
        const kk=ovKey(c,s,k); if(seen.has(kk)) return; seen.add(kk);
        const st=c.s||c.e, e=c.e;
        const g=key(e)===key(t)?"due":e<t?"late":(st<=t&&t<=e?"doing":null);
        if(!g) return;
        const kk2=c.work?1:c.batch?c.batch[0]:k;
        out.push({w,S,k:kk2,s,c,g,ep:c.work?"작품 1회":c.batch?`${c.batch[0]}~${c.batch[1]}화`:`${k}화`}); }); }
  });
  const ord={late:0,due:1,doing:2};
  return out.sort((a,b)=>ord[a.g]-ord[b.g]||a.c.e-b.c.e||(a.w.pos||0)-(b.w.pos||0));
}

  document.querySelectorAll("#v-prod .tdgo").forEach(b=>b.onclick=()=>{ SEL=b.dataset.tw; FOCUS={k:+b.dataset.tk,s:b.dataset.ts}; SHOWALL=+b.dataset.tk>20?true:SHOWALL; render(); });

  document.querySelectorAll("#v-prod .tdmore").forEach(b=>b.onclick=()=>{ TODAY_MORE=true; render(); });
  document.querySelectorAll("#v-prod .tdless").forEach(b=>b.onclick=()=>{ TODAY_MORE=false; render(); });
  if(FOCUS){ const el=document.querySelector(`#v-prod .cl[data-ep="${FOCUS.k}"][data-s="${FOCUS.s}"]`); FOCUS=null;
    if(el){ el.scrollIntoView({block:"center",inline:"center"}); el.classList.add("flashc"); setTimeout(()=>el.classList.remove("flashc"),2200); } }
  document.querySelectorAll("#v-prod [data-addep]").forEach(b=>b.onclick=()=>{
    const n=clamp((+w.total||S.N||0)+(+b.dataset.addep),1,300); SHOWALL=true; edit(w.id,[{p:["total"],v:n}]); });
  document.querySelectorAll("#v-prod [data-f]").forEach(el=>el.onchange=()=>{
    const fk=el.dataset.f; let v=el.value;
    if(["done","rate","total","b1"].includes(fk)){ v=parseInt(v,10); if(isNaN(v))return;
      const lm={done:[0,300],rate:[1,60],total:[1,300],b1:[1,300]}[fk]; v=clamp(v,lm[0],lm[1]); }
    else if(fk==="n"){ v=v.trim()||"이름 없음"; }
    else if(fk==="nJa"){ v=v.trim(); if(!v){ edit(w.id,[{p:["nJa"],del:true}]); return; } }
    else if((fk==="start"||fk==="launch")&&!v) return;
    else if(fk==="start"){ v=key(snapBD(D(v))); }   // 착수일은 영업일로
    if(fk==="start"){   // 착수일을 정하면 런칭은 휴재 없는 가장 빠른 날로 자동
      edit(w.id,[{p:["start"],v},{p:["launchAuto"],v:true},{p:["launchByPlan"],del:true},{p:["launch0"],del:true}]); return; }
    if(fk==="launch"){ edit(w.id,[{p:["launch"],v},{p:["launchAuto"],del:true}]); return; }
    edit(w.id,[{p:[fk],v}]);
  });
  document.querySelectorAll("#v-prod [data-tzf]").forEach(el=>el.onchange=()=>{ const f=el.dataset.tzf, v=f==="ep"?Math.max(1,+el.value||1):f==="dow"?(el.value===""?"":+el.value):el.value; edit(w.id,[{p:["tz"],v:{...(w.tz||{mode:"auto"}),[f]:v}}]); });
  document.querySelectorAll("#v-prod [data-sel]").forEach(el=>el.onchange=()=>{
    if(el.dataset.sel==="voice"){ edit(w.id,[{p:["voice"],v:el.value}]); return; }
    if(el.dataset.sel==="dow"){ edit(w.id,[el.value===""?{p:["dow"],del:true}:{p:["dow"],v:+el.value}]); return; }
    if(el.dataset.sel==="tzMode"){ edit(w.id,el.value==="off"?[{p:["tz"],del:true}]:[{p:["tz"],v:{...(w.tz||{ep:1,date:key(TODAY)}),mode:el.value}}]); return; }
    if(el.dataset.sel==="fb3"){ edit(w.id,[el.value==="1"?{p:["fbLegacy"],del:true}:{p:["fbLegacy"],v:true}]); return; }
    if(el.dataset.sel==="lauto"){ edit(w.id,el.value==="1"?[{p:["launchAuto"],v:true},{p:["launchByPlan"],del:true}]:[{p:["launchAuto"],del:true},{p:["launch"],v:w.launch&&!w.launchAuto?w.launch:key(schedule(w).L||TODAY)}]); return; }
    if(el.dataset.sel==="age"){ edit(w.id,[el.value?{p:["age"],v:el.value}:{p:["age"],del:true}]); return; }
    if(el.dataset.sel==="cont"){ edit(w.id,[{p:["cont"],v:el.value==="1"}]); return; }
    const ext=el.value==="ext", tmp={...w,team:ext?{...(w.team||{}),prod1:"외부 제작사",prodF:"외부 제작사"}:{}};
    const ps=ext?[{p:["team","prod1"],v:"외부 제작사"},{p:["team","prodF"],v:"외부 제작사"},{p:["line"],v:"ext"}]
               :[{p:["team","prod1"],del:true},{p:["team","prodF"],del:true},{p:["line"],v:"int"}];
    tmp.line=el.value; ps.push({p:["rate"],v:defRate(tmp)});   // 라인 기본 1차 제작 일수로
    edit(w.id,ps);
  });
  $("cpCopy").onclick=(e)=>{ e.stopPropagation(); cpOpen(w,S,e.currentTarget); };
  if($("cpPaste")) $("cpPaste").onclick=()=>cpPaste(w);
  if($("cpClear")) $("cpClear").onclick=()=>{ CLIP=null; render(); };
  if($("fb3Go")) $("fb3Go").onclick=()=>{ edit(w.id,[{p:["fbLegacy"],del:true}]); };
  document.querySelectorAll("#v-prod [data-pause]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    const k=+b.dataset.pause, c=S.eps[k]&&S.eps[k].cells.prod1, from=c&&c.s&&c.s>TODAY?c.s:TODAY;
    if(!confirm(`${k}화부터 제작을 중단합니다. 재개일을 정할 때까지 런칭은 '미정'으로 표시됩니다.`)) return;
    const others=(w.pauses||[]).filter(p=>p.ep<k&&p.resume);
    edit(w.id,[{p:["pauses"],v:[...others,{ep:k,from:key(from),resume:null}]}]); });
  document.querySelectorAll("#v-prod [data-resume]").forEach(b=>b.onclick=(e)=>{e.stopPropagation(); openResume(w,+b.dataset.resume,b);});
  document.querySelectorAll("#v-prod [data-unpause]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    if(!confirm("중단 표시를 없애고 원래 일정대로 계산할까요?")) return;
    edit(w.id,[{p:["pauses"],v:(w.pauses||[]).filter(p=>p.ep!==+b.dataset.unpause)}]); });
  document.querySelectorAll("#v-prod [data-len]").forEach(el=>el.onchange=()=>{ const v=parseLen(el.value), k=el.dataset.len;
    if(v===null){ edit(w.id,[{p:["len",k],del:true}]); return; }
    if(isNaN(v)||v<=0||v>3600){ el.style.borderColor="var(--bad)"; toast("길이는 3:30처럼 분:초로, 또는 3.5처럼 분으로 적어 주세요"); return; }
    edit(w.id,[{p:["len",k],v}]); });
  document.querySelectorAll("#v-prod .ck[data-ck]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();toggleDone(w,S,+b.dataset.ck,b.dataset.s);});
  document.querySelectorAll("#v-prod .cl[data-ep]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();openPop(w,S,+b.dataset.ep,b.dataset.s,b);});
}

/* 칸 편집 팝오버 */
function openPop(w,S,k,sk,anchor){
  const pop=$("pop"), E=S.eps[k], s=CONF.stages.find(x=>x.k===sk), c=E.cells[sk];
  const K=ovKey(c,s,k), o=(w.ov||{})[K]||{};
  const bt=c.batch, label=c.work?"작품 1회":bt?`${bt[0]}~${bt[1]}화 묶음`:`${k}화`;
  const dv=o.d!=null?o.d:c.base;
  const nextLab=bt?"다음 묶음에도":`${k+1}화 이후에도`;
  pop.innerHTML=`<h4>${label} · ${esc(s.n)}</h4><p class="ps">${esc(teamOf(s,w))} · 지금 ${c.s?ymd(c.s)+" ~ ":""}${ymd(c.e)}</p>
    ${c.done&&!o.f?"":`<div class="row"><span>소요 영업일</span><input class="in n" type="number" min="0" max="120" id="pD" value="${dv}">
      <button type="button" class="q" data-q="1">+1</button><button type="button" class="q" data-q="2">+2</button><button type="button" class="q" data-q="5">+5</button></div>
    <p class="note">기본 ${c.base}일${sk==="prod1"?" (작품 설정값)":""} · 주말·공휴일은 세지 않습니다</p>
    ${c.work||c.grp?"":`<label class="chk"><input type="checkbox" id="pAll"> ${nextLab} 같은 소요일 적용</label>`}`}
    <div class="row"><span>시작일 지정</span><input class="in" type="date" id="pS" value="${o.s||""}"></div>
    <div class="row"><span>완료일 지정</span><input class="in" type="date" id="pF" value="${o.f||""}"></div>
    <p class="note">시작일만 넣으면 그날부터 소요일만큼, 시작일·완료일을 둘 다 넣으면 그 기간으로 잡아요.</p>
    <p class="note">실제로 끝난 날이나 확정한 날짜. 앞 단계보다 먼저 끝나도 그대로 지켜요(병행으로 계산). 주말·휴일이어도 그 날짜로 기록해요.</p>
    <label class="chk"><input type="checkbox" id="pSlip"${o.follow?" checked":""}> 앞 단계가 늦어지면 이 날짜도 뒤로 밀기</label>
    <div class="row"><span>메모</span><input class="in" type="text" id="pM" style="flex:1;min-width:0" value="${esc(o.m||"")}" placeholder="예: 작가 수정 요청으로 2일 지연"></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:10px"><span>완료</span>${o.ok
      ?`<span class="tag good" style="width:auto">완료 ${ymd(c.e)}</span><button type="button" class="q" id="pUndo">완료 취소</button>`
      :`<button type="button" class="btn pri" id="pDone" style="padding:4px 10px">✓ 완료 처리</button><span class="hint" style="width:auto">완료일 ${o.f?"= 위 지정일":ymd(doneDate(c))}</span>`}</div>
    <div class="acts"><button type="button" class="btn" id="pR">기본값으로</button><button type="button" class="btn" id="pX">닫기</button><button type="button" class="btn pri" id="pA">적용</button></div>`;
  pop.hidden=false;
  const r=anchor.getBoundingClientRect(), cw=document.documentElement.clientWidth;
  let left=r.left+window.scrollX, top=r.bottom+window.scrollY+6;
  if(left+350>window.scrollX+cw) left=window.scrollX+cw-356;
  if(r.bottom+pop.offsetHeight+12>window.innerHeight) top=r.top+window.scrollY-pop.offsetHeight-6;
  pop.style.left=Math.max(8,left)+"px"; pop.style.top=Math.max(8,top)+"px";
  const first=pop.querySelector("#pD")||pop.querySelector("#pF"); first&&first.focus();
  pop.querySelectorAll(".q").forEach(b=>b.onclick=()=>{const i=$("pD");i.value=(parseInt(i.value,10)||0)+ +b.dataset.q;});
  $("pX").onclick=closePop;
  if($("pDone")) $("pDone").onclick=()=>{ let fv=$("pF").value; fv=fv?key(fixD(fv)):key(doneDate(c));
    const x={...o,ok:true,f:fv}; delete x.d; const mv=$("pM").value.trim(); if(mv) x.m=mv; edit(w.id,[{p:["ov",K],v:x}]); closePop(); };
  if($("pUndo")) $("pUndo").onclick=()=>{ const x={...o}; delete x.ok; delete x.f; edit(w.id,[Object.keys(x).length?{p:["ov",K],v:x}:{p:["ov",K],del:true}]); closePop(); };
  $("pR").onclick=()=>{ edit(w.id,[{p:["ov",K],del:true}]); closePop(); };
  $("pA").onclick=()=>{
    let fv=$("pF").value; if(fv) fv=key(fixD(fv));
    const di=$("pD"), dvn=di?parseInt(di.value,10):NaN;
    const mk=(prevO,d,f)=>{const x={...prevO}; if(d!=null&&!isNaN(d)){ if(d!==c.base) x.d=d; else delete x.d; }
      if(f!==undefined){ if(f) x.f=f; else delete x.f; } return x;};
    const put=(kk,x)=>Object.keys(x).length?{p:["ov",kk],v:x}:{p:["ov",kk],del:true};
    const x0=mk(o,di?dvn:null,fv); const mv=$("pM").value.trim(); if(mv) x0.m=mv; else delete x0.m;
    { const sv=$("pS")?$("pS").value:""; if(sv) x0.s=key(snapBD(D(sv))); else delete x0.s;
      if(x0.s&&x0.f&&x0.f<x0.s){ toast("완료일이 시작일보다 빨라요"); return; }
      if(x0.s&&x0.f) delete x0.d; }   // 기간을 정했으면 소요일은 기간에서 계산
    if(x0.f){ if($("pSlip")&&$("pSlip").checked){ delete x0.lock; x0.follow=true; } else { x0.lock=true; delete x0.follow; } } else { delete x0.lock; delete x0.follow; }   // 직접 넣은 완료일은 그대로 지킴 (앞 단계와 병행한 것으로 봄)
    const ps=[put(K,x0)];
    if($("pAll")&&$("pAll").checked&&!isNaN(dvn)){
      const targets=bt?S.BT.filter(([a])=>a>bt[0]).map(([a])=>a):[...Array(S.N-k)].map((_,i)=>k+1+i);
      targets.forEach(j=>{const kk=`${j}:${sk}`; ps.push(put(kk,mk((w.ov||{})[kk]||{},dvn)));});
    }
    edit(w.id,ps); closePop();
  };
  pop.onkeydown=(e)=>{ if(e.key==="Escape") closePop(); if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.type!=="checkbox") $("pA").click(); };
}
function closePop(){ $("pop").hidden=true; render(); }
document.addEventListener("click",(e)=>{ const p=$("pop"); if(!p.hidden&&!p.contains(e.target)) closePop(); });

/* ── 공정 기준 ── */
function renderStd(){
  const st=CONF.stages, sum=(f)=>st.reduce((a,s)=>a+(+s[f]||0),0);
  const VK=["ih","ia","eh","ea"];

  const tot=(v)=>{ const w0={line:v[0]==="e"?"ext":"int",voice:v[1]==="a"?"ai":"human",n:""};
    return st.filter(x=>x.k!=="contract"&&!FB3_OLD.includes(x.k)&&!x.par&&!concOf(x,w0,1)&&!(x.atStart&&x.atStart[v[0]]))
      .reduce((a,x)=>a+(+(x.vf&&x.vf[v]!=null?x.vf[v]:x.v[v])||0),0); };

  <table class="std"><thead><tr><th>단계</th><th>담당 부서</th>${VK.map(k=>`<th class="r">${VAR_LABEL[k]}</th>`).join("")}<th>진행 단위</th><th title="비우면 전 회차">적용 회차</th><th title="다음 단계를 막지 않고 동시에 진행 — 자막 최종 영상본 전까지만 끝나면 됨">병렬</th><th title="앞 단계와 같은 날 시작">동시 시작</th></tr></thead><tbody>`;
  st.forEach((s,i)=>{
    const num=(k)=>`<input class="in n" style="width:58px" type="number" min="0" max="120" data-i="${i}" data-c="v" data-var="${k}" value="${s.v[k]}">`;
    h+=`<tr><td>${esc(s.n)}${s.k==="prod1"?`<div class="hint">작품별 설정이 우선 · 새 작품 기본값</div>`:s.k==="contract"?`<div class="hint">제작 시작 N영업일 전까지 (일정 영향 없음)</div>`:s.k==="casting"?`<div class="hint">내부: 첫 묶음만 +2일 · 외부: 제작 시작과 함께 3일 (일정 영향 없음)</div>`:s.k==="dub"?`<div class="hint">외부: '더빙·믹싱' 통으로 · 한 번에 한 묶음씩 · 5화 미만 묶음은 비례 단축</div>`:s.k==="imgcut"?`<div class="hint">외부 1화만 · 1일째 공유 + 1일 피드백 (영상 1차와 동시)</div>`:s.k==="dubchk"?`<div class="hint">외부 1화만 · 첫 묶음 사운드 6일차 공유 + 3일 피드백</div>`:s.k==="burn"?`<div class="hint">외부: 사운드 납품 후 당사가 회차당 1일씩 (자막 번역·입히기)</div>`:s.k==="trans"?`<div class="hint">외부: 제작사가 대사·녹음 대본 준비 (0일)</div>`:s.k==="fb3"?`<div class="hint">내부·외부: 1~3화 영상 1차가 다 나오면 한 번에 피드백 (작가·내부 승인·등급 피드백 포함)</div>`:s.k==="fix3"?`<div class="hint">내부·외부 (외부는 제작사): 피드백 반영해 1~3화 한 번에 수정</div>`:FB3_OLD.includes(s.k)?`<div class="hint">1~3화는 '회차별'로 둔 작품만 적용${s.k==="intAppr"?" · 외부는 4화부터 회차별로 계속":s.k==="prodF"?" · 외부 4화부터는 아래 체크를 켤 때만":""}</div>`:s.k==="rating"&&s.from?`<div class="hint"><b>${s.from.slice(2,4)}.${+s.from.slice(5,7)} 이후 공개분부터</b> 적용 (광고 모델) · 그 전 공개 회차는 0일</div>`:s.k==="vtrans"?`<div class="hint">대사 번역과 동시 시작 · 영상 속 글자 번역·번인 · <b>기간 미정</b>(0이면 일정 영향 없음, 업체 정해지면 일수 입력)</div>`:""}</td>
      <td><input class="in" style="width:130px" data-i="${i}" data-c="team" value="${esc(s.team)}" aria-label="${esc(s.n)} 담당 부서"></td>

function applyPatch(o,{p,v,del}){
  let x=o; for(let i=0;i<p.length-1;i++){ if(typeof x[p[i]]!=="object"||x[p[i]]===null) x[p[i]]={}; x=x[p[i]]; }
  if(del) delete x[p[p.length-1]]; else x[p[p.length-1]]=v;
}

function errMsg(e){
  const m=String(e&&e.message||e), code=(m.match(/^(\d{3})/)||[])[1];
  if(!code) return ["주소(URL)에 접속하지 못했어요 — 인터넷 또는 URL 확인",m];
  if(code==="401") return ["키가 맞지 않아요 (401) — Publishable key 확인",m];
  if(code==="404") return ["테이블을 못 찾았어요 (404) — SQL 실행 여부 확인",m];
  if(code==="403"||/42501|permission/i.test(m)) return ["권한이 없어요 (403) — SQL의 grant 줄 실행 확인",m];
  return [`연결 오류 (${code})`,m];
}
const AUTH_SQL=`-- ① 일정 테이블 (이미 만들었으면 그대로 두세요)
create table if not exists anime_works (id text primary key, pos int default 0, data jsonb not null, updated_at timestamptz not null default now());

alter table anime_config enable row level security;

-- ② 사용자 목록 (가입하면 자동으로 '승인 대기')
create table if not exists app_users (
  id uuid primary key references auth.users(id) on delete cascade,
  email text not null, name text default '',
  approved boolean not null default false, is_admin boolean not null default false,
  created_at timestamptz not null default now());
alter table app_users enable row level security;

create or replace function is_approved() returns boolean language sql stable security definer set search_path=public
  as $$ select exists(select 1 from app_users where id=auth.uid() and approved) $$;
create or replace function is_admin() returns boolean language sql stable security definer set search_path=public
  as $$ select exists(select 1 from app_users where id=auth.uid() and approved and is_admin) $$;

create or replace function handle_new_user() returns trigger language plpgsql security definer set search_path=public as $$
begin
  -- 회사 메일(@webtoonscorp.com, @webtoon.com)만 가입 가능
  if not (new.email ilike '%@webtoonscorp.com' or new.email ilike '%@webtoon.com') then raise exception 'company mail only'; end if;
  insert into app_users(id,email,name) values (new.id, new.email, coalesce(new.raw_user_meta_data->>'name',''));
  return new;
end $$;
drop trigger if exists on_auth_user_created on auth.users;
create trigger on_auth_user_created after insert on auth.users for each row execute function handle_new_user();

drop policy if exists "me or admin" on app_users;
drop policy if exists "admin approves" on app_users;
create policy "me or admin" on app_users for select to authenticated using (id=auth.uid() or is_admin());
create policy "admin approves" on app_users for update to authenticated using (is_admin()) with check (is_admin());
grant select, update on app_users to authenticated;

-- ③ 일정 데이터는 '승인된 사람'만 (링크만 알아서는 못 봄)

drop policy if exists "approved rw" on anime_works;
drop policy if exists "approved rw" on anime_config;
revoke all on anime_works, anime_config from anon;
create policy "approved rw" on anime_works  for all to authenticated using (is_approved()) with check (is_approved());
create policy "approved rw" on anime_config for all to authenticated using (is_approved()) with check (is_approved());
grant select, insert, update, delete on anime_works, anime_config to authenticated;

async function authApi(path,body,token){
  const r=await fetch(`${SUPABASE_URL}/auth/v1/${path}`,{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json",...(token?{Authorization:`Bearer ${token}`}:{})},body:JSON.stringify(body||{})});
  const t=await r.text(); let j={}; try{ j=t?JSON.parse(t):{}; }catch(e){}
  if(!r.ok){ const m=j.msg||j.error_description||j.message||t; const e=new Error(m); e.status=r.status; throw e; }
  return j;
}

      history.replaceState(null,"",location.pathname+location.search);

async function sb(method,table,q="",body,prefer){

/* 이름 · 홈페이지 주소 수정 (작은 창) */
function vLinkEditor(v,anchor){
  if(!v) return; const pop=$("pop");
  pop.innerHTML=`<h4>이름 · 홈페이지 수정</h4><p class="ps">이름을 누르면 첫 번째 주소가 열려요</p>
    <div class="row"><span>제작사 이름</span><input class="in" id="lkN" style="flex:1" value="${esc(v.name||"")}"></div>
    <div class="row" style="align-items:flex-start"><span>홈페이지</span><textarea class="in" id="lkU" rows="3" style="flex:1;font:inherit;font-size:12.5px" placeholder="https://… (여러 개면 줄바꿈 · 첫 줄이 이름 링크)">${esc(v.url||"")}</textarea></div>
    <div class="acts"><button type="button" class="btn" id="lkX">닫기</button><button type="button" class="btn pri" id="lkOk">저장</button></div>`;
  pop.hidden=false;
  const r=anchor.getBoundingClientRect(); pop.style.left=Math.max(8,r.left+window.scrollX)+"px"; pop.style.top=(r.bottom+window.scrollY+6)+"px";
  $("lkN").focus();
  $("lkX").onclick=closePop;
  $("lkOk").onclick=()=>{ const n=$("lkN").value.trim();
    if(!n){ toast("외주 제작사 이름은 비울 수 없어요"); return; }
    const u=$("lkU").value.split(/\s+/).map(x=>x.trim()).filter(Boolean).map(x=>/^https?:\/\//i.test(x)?x:"https://"+x).join("\n");
    vEdit({op:"set",id:v.id,v:{name:n,url:u}}); closePop(); };
  pop.onkeydown=(e)=>{ if(e.key==="Escape") closePop(); if(e.key==="Enter"&&e.target.id==="lkN"){ e.preventDefault(); $("lkOk").click(); } };
}
function vInline(el){
  if(el.querySelector("textarea")) return;
  const v=VENDORS.find(x=>x.id===el.dataset.vid), k=el.dataset.vk; if(!v) return;
  const memo=k==="note";   // 비고는 메모장처럼: Enter = 줄바꿈, 다른 곳 누르면 저장
  const fit=()=>{ ta.rows=Math.max(memo?3:1,Math.min(memo?18:6,(ta.value.match(/\n/g)||[]).length+1)); };
  const ta=document.createElement("textarea"); ta.className="vin"+(memo?" memo":""); ta.value=v[k]||""; fit();
  el.innerHTML=""; el.appendChild(ta); if(memo){ const h=document.createElement("div"); h.className="vmh"; h.textContent="Enter 줄바꿈 · 다른 곳 클릭 또는 Ctrl/⌘+Enter 저장 · Esc 취소"; el.appendChild(h); }
  el.classList.add("editing"); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
  let done=false;
  const fin=(save)=>{ if(done) return; done=true; el.classList.remove("editing");
    const nv=ta.value.trim();
    if(save&&nv!==(v[k]||"")){ if(k==="name"&&!nv){ toast("외주 제작사 이름은 비울 수 없어요"); render(); return; } vEdit({op:"set",id:v.id,v:{[k]:nv}}); }
    else render(); };
  ta.onkeydown=(e)=>{
    if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); fin(true); return; }
    if(e.key==="Enter"&&!e.shiftKey&&!memo&&!e.isComposing){ e.preventDefault(); fin(true); }
    else if(e.key==="Escape"){ e.preventDefault(); fin(false); } };
  ta.oninput=fit;
  ta.onblur=()=>fin(true);
}

  const pop=$("pop"); pop.classList.add("wide");
  pop.innerHTML=`<h4>${isNew?"외주사 추가":esc(v.name)+" 수정"}</h4><div class="vgrid">${F.map(inp).join("")}</div>
    <div class="acts">${isNew?"":`<button type="button" class="btn danger" id="veDel">삭제</button><span style="flex:1"></span>`}<button type="button" class="btn" id="veX">닫기</button><button type="button" class="btn pri" id="veOk">${isNew?"추가":"저장"}</button></div>`;
  pop.hidden=false;
  const r=anchor.getBoundingClientRect(), cw=document.documentElement.clientWidth;

  $("veX").onclick=close;
  $("veOk").onclick=()=>{ const o={}; pop.querySelectorAll("[data-ef]").forEach(el=>{ o[el.dataset.ef]=el.value.trim(); });

  if($("veDel")) $("veDel").onclick=()=>{ if(confirm(`'${v.name}'을(를) 목록에서 삭제할까요? 모든 사람 화면에서 사라집니다.`)){ vEdit({op:"del",id:v.id}); close(); } };

function lpCompute(P){

    const bdOf=(start)=>{ if(w.bd&&!(g.ignoreBd&&!w.fixed)) return +w.bd; return (T.bd2&&T.bd2From&&start&&key(start)>=T.bd2From)?+T.bd2:+T.bd; };

    const roughStart=basis==="start"?lpD(w.start):lpAdd(lpD(w.launch),-lpLead(line,"human",bdOf(lpD(w.launch)),g));
    let bd=bdOf(roughStart), voice=w.voice&&!(g.ignoreVoice&&!w.fixed)?w.voice:"";

      if(ok){ aiCnt[T.id]=(aiCnt[T.id]||0)+1; const n=aiCnt[T.id]; voice=Math.floor(n*(+T.ai||0)+1e-9)>Math.floor((n-1)*(+T.ai||0)+1e-9)?"ai":"human"; }
      else voice="human"; }
    let lead=lpLead(line,voice,bd,g)+(voice==="ai"?+g.aiDelayW||0:0);
    let start, launch;
    if(basis==="start"){ start=lpD(w.start); launch=lpAdd(start,lead); }
    else { launch=lpD(w.launch); start=lpAdd(launch,-lead); const bd2=bdOf(start); if(bd2!==bd){ bd=bd2; lead=lpLead(line,voice,bd,g)+(voice==="ai"?+g.aiDelayW||0:0); start=lpAdd(launch,-lead); } }
    const runW=Math.ceil((+g.season-Math.min(+g.openK,+g.season))*(+g.cad||1));
    const seasons=[]; let L=launch, S0=start;
    for(let s=1;s<=Math.max(1,+g.maxSeasons||1);s++){
      const last=lpAdd(L,runW); seasons.push({s,start:S0,launch:L,last});
      if(g.follow==="slot"){ L=lpAdd(last,(+g.restW||0)+1); S0=lpAdd(L,-lead); }
      else { S0=lpAdd(last,+g.restW||0); L=lpAdd(S0,lead); }
      if(key(S0)>"2029-06-30") break;   // 2028년 말 집계에 필요한 만큼만 (마지막 시즌 뒤 휴방까지)
    }
    const viol=!w.fixed&&T.start&&key(start)<T.start;

  const z=()=>Object.fromEntries(LP_MONTHS.map(m=>[m,0]));

  teams.forEach(t=>{ agg.launch[t]=z(); agg.ai[t]=z(); agg.start[t]=z(); agg.onair[t]=z(); });
  const mEnd=(m)=>{ const [y,mm]=m.split("-").map(Number); return key(addDays(D(`${mm===12?y+1:y}-${String(mm===12?1:mm+1).padStart(2,"0")}-01`),-1)); };
  res.forEach(r=>{ if(!r) return; const t=r.T.id;
    r.seasons.forEach((s,si)=>{ if(si>0&&!g.countFollow){} else {

        if(agg.launch[t][lm]!=null){ agg.launch[t][lm]++; if(r.voice==="ai") agg.ai[t][lm]++; }
        if(agg.start[t][sm]!=null) agg.start[t][sm]++; } });
    LP_MONTHS.forEach(m=>{ const e=mEnd(m);
      const on=r.seasons.some((s,si)=>{ const nx=r.seasons[si+1]; const endTo=g.countRest&&nx?addDays(nx.launch,-1):s.last; return key(s.launch)<=e&&key(endTo)>=e; });
      if(on) agg.onair[t][m]++; }); });
  const cp=P.cp||{}, cpOn=z(); Object.entries(cp).forEach(([m,n])=>{ const i=LP_MONTHS.indexOf(m); if(i<0) return; const span=Math.ceil(((+g.season-(+g.openK))*(+g.cad||1)+1)/4.3);
    for(let j=i;j<Math.min(24,i+span);j++) cpOn[LP_MONTHS[j]]+=+n||0; });
  const tot=(k)=>Object.fromEntries(LP_MONTHS.map(m=>[m,teams.reduce((a,t)=>a+agg[k][t][m],0)+(k==="launch"?(+cp[m]||0):k==="onair"?cpOn[m]:0)]));
  const T={launch:tot("launch"),ai:tot("ai"),start:tot("start"),onair:tot("onair")};
  let c=0; const cum=Object.fromEntries(LP_MONTHS.map(m=>[m,c+=T.launch[m]]));
  return {res,agg,T,cum,cpOn,teams};
}

    <tr class="sgh"><td class="tl" colspan="${Y.length+1}">⑤ BM · 마일스톤 <span class="hint" style="font-weight:500">아래에서 추가·수정</span></td></tr>

      <input class="in" style="flex:1" data-mst="${i}" value="${esc(x.t)}"${ro?" disabled":""}>${ro?"":`<button type="button" class="vdel" data-msdel="${i}">✕</button>`}</div>`).join("")}

/* 연재 스케줄 간트: 작품마다 제작(착수~30화 영상 1차) · 런칭 대기 · 연재(런칭~마지막 화) 막대 */

function lcEpsByMonth(L,g){ const N=+g.season||30, K=Math.min(N,+g.openK||3), cad=+g.cad||1, M=LP2_M, out={}, MS=M.map(lp2MStart), ME=M.map(lp2MEnd);

  return out; }

/* ===================== 확장 플랜 (엑셀 'Short Animation Title Expansion Plan v0.99' 그대로) =====================

const XP_TEAMS=["내부1","내부2","내부3","외부 일본","외부 일본 외"];

function xpTeam(t){ const A=XP.all, T=XP.teams[t]||{}; const v=(k)=>T[k]!=null&&T[k]!==""?T[k]:A[k];
  return {from:T.from||"", bd:+v("bd"), ai:+v("ai"), aiFrom:v("aiFrom"), ch:+(v("ch")||0), ca:+(v("ca")||0)}; }

/* 작품 플랜 한 줄씩 계산 (엑셀 6~505행) */

    const AB=Y-7, AA=Math.max(V,AB-N*P*7/5);                                                     // AA/AB 회차 제작 시작·종료
    const warn=(S===1&&!confRow&&V<xpDay(T.from))?"⚠ 착수 가능일 이전":"";                      // AF 체크
    const eps=XP_M.map((m,i)=>AC===1?N*Math.max(0,Math.min(AB,xpME[i])-Math.max(AA,xpMS[i])+1)/Math.max(1,AB-AA+1):0);
    const o={ix,S,team,N,O,P,Q,R:Rr,Sn,T:Tv,U,V,W,Y,Z,AA,AB,AC,warn,eps,conf:confRow};
    out.push(o); prev=o; });
  return out; }

/* 월별 현황 (엑셀 '월별 현황' 시트) */
function xpMonthly(C){ const L=XP.lev, z=()=>XP_M.map(()=>0), cnt=(f)=>XP_M.map((m,i)=>C.filter(o=>f(o,i)).length);
  const sIn=(o)=>L.contIn==="Y"?o.S>=1:o.S===1, inM=(d,i)=>d>=xpMS[i]&&d<=xpME[i];
  const by=(fn)=>{ const o={}; XP_TEAMS.forEach(t=>o[t]=fn(t)); return o; };
  const R={
    onair:by(t=>cnt((o,i)=>o.team===t&&o.AC===1&&o.W<=xpME[i]&&o.Z>xpME[i])),
    launch:by(t=>cnt((o,i)=>o.team===t&&o.AC===1&&inM(o.W,i)&&sIn(o))),
    eps:by(t=>XP_M.map((m,i)=>C.filter(o=>o.team===t).reduce((a,o)=>a+o.eps[i],0))),
    start:by(t=>cnt((o,i)=>o.team===t&&o.AC===1&&inM(o.V,i)&&sIn(o))),
    conc:by(t=>cnt((o,i)=>o.team===t&&o.AC===1&&o.V<=xpME[i]&&o.AB>=xpMS[i])),
    cost:by(t=>{ const T=xpTeam(t); return XP_M.map((m,i)=>C.filter(o=>o.team===t).reduce((a,o)=>a+o.eps[i]*(o.T==="AI성우"?T.ca:T.ch),0)); }) };
  const sum=(o)=>XP_M.map((m,i)=>XP_TEAMS.reduce((a,t)=>a+o[t][i],0));
  const tot={onair:sum(R.onair),launch:sum(R.launch),eps:sum(R.eps),start:sum(R.start),conc:sum(R.conc),cost:sum(R.cost)};
  const v=(kind)=>({ AI:cnt((o,i)=>o.T==="AI성우"&&o.AC===1&&inM(o[kind],i)&&sIn(o)), H:cnt((o,i)=>o.T==="인간성우"&&o.AC===1&&inM(o[kind],i)&&sIn(o)) });
  const aux={ launchV:v("W"), startV:v("V"),
    epsV:{AI:XP_M.map((m,i)=>C.filter(o=>o.T==="AI성우").reduce((a,o)=>a+o.eps[i],0)), H:XP_M.map((m,i)=>C.filter(o=>o.T==="인간성우").reduce((a,o)=>a+o.eps[i],0))},
    contL:cnt((o,i)=>o.AC===1&&o.S>=2&&inM(o.W,i)), contS:cnt((o,i)=>o.AC===1&&o.S>=2&&inM(o.V,i)) };
  const tgt=XP_M.map(m=>{ const t=XP.targets[m]; return t==null||t===""?null:+t; });
  // ⑤ 결과 요약
  const d27=xpDay("2027-01-01"), d28e=xpDay("2028-12-31"), in2728=C.filter(o=>o.AC===1&&o.V>=d27&&o.V<=d28e);
  const iy=(y)=>XP_M.map((m,i)=>m.startsWith(y)?i:-1).filter(i=>i>=0), sumY=(a,y)=>iy(y).reduce((s,i)=>s+a[i],0);
  const S={on27:tot.onair[11],on28:tot.onair[23],t27:tgt[11],t28:tgt[23],l27:sumY(tot.launch,"2027"),l28:sumY(tot.launch,"2028"),
    aiR:in2728.length?in2728.filter(o=>o.T==="AI성우").length/in2728.length:0, avgBD:in2728.length?in2728.reduce((a,o)=>a+o.P,0)/in2728.length:0,
    e27:sumY(tot.eps,"2027"), e28:sumY(tot.eps,"2028"), cost:tot.cost.reduce((a,b)=>a+b,0), warn:C.filter(o=>o.warn).length};
  return {R,tot,aux,tgt,S}; }

async function xpSave(){ if(!XP) return; const sig=JSON.stringify(XP); if(sig===XP_SIG) return;

    if(!SB.on) lsSet("anime_xplan",data); else await sb("POST",T_CONF,"",[{id:"xplan",data,updated_at:data.at}],"resolution=merge-duplicates");
    XP_SIG=sig; XP_AT=data.at; const el=$("xpSaved"); if(el) el.textContent=`저장됨 · ${data.at.slice(11,16)}`; }

      if(op) x.ss.forEach(z=>{ pb+=`<tr class="xpsub${z.AC?"":" off"}"><td></td><td class="hint">시즌 ${z.S}${z.AC?"":" (비활성)"}</td><td colspan="5" class="hint">화수 ${z.N} · 영업일 ${z.P} · 제작기간 ${z.U}주 · AI 판정 ${fd(z.Q)}${z.R?` · AI 순번 ${z.Sn}`:""}</td><td colspan="4" class="hint">회차 제작 ${fd(z.AA)} ~ ${fd(z.AB)}</td><td class="hint">${esc(z.O)}</td><td>${z.T==="AI성우"?`<span class="gai">AI</span>`:"인간"}</td><td>${fd(z.V)}</td><td><b>${fd(z.W)}</b></td><td>${fd(z.Y)}</td><td class="hint">집계 끝 ${fd(z.Z)}</td><td></td></tr>`; }); });
    h+=`<div class="card" style="padding:0;overflow:auto;max-height:70vh"><table class="xpplan"><thead>${TH}</thead><tbody>${pb}</tbody></table></div>`; }
  h+=`<p class="hint" style="margin-top:10px">슬롯 = 연재 자리 하나. 시즌1 런칭 → ${L.season}화 연재 → ${L.rest}주 휴식 → 다음 시즌(또는 다음 작품). '연재 슬롯 유지'면 다음 시즌 런칭 = 이전 시즌 마지막 화 + 휴식 + 1주 (착수는 그만큼 역산) · '제작팀 순환'이면 연재 종료+휴식 뒤 착수. 회차는 1화당 영업일만큼 걸려 마지막 화가 방영 1주 전에 끝나도록 역산해 월별로 나눠요.</p>`;
  v.innerHTML=h; xpBind(); xpSaveSoon(); }

function xpBind(){ const set=(path,val)=>{ const ks=path.split("."); let o=XP; for(let i=0;i<ks.length-1;i++){ o[ks[i]]=o[ks[i]]||{}; o=o[ks[i]]; } const k=ks[ks.length-1];
    if(val===""||val==null){ if(ks[0]==="teams"||ks[0]==="targets") delete o[k]; else o[k]=""; } else o[k]=val; };
  const numish=(p,v)=>{ if(/aiFrom|from$|^targets|\.g$|\.h$/.test(p)) return v.trim(); const t=v.trim(); if(t==="") return ""; const x=+t.replace(/,/g,""); return isFinite(x)?x:t; };
  document.querySelectorAll("#v-xp .xpi").forEach(el=>el.onchange=()=>{ let v=el.value.trim(); const p=el.dataset.xp;
    if(/aiFrom|\.from$/.test(p)&&/^\d{4}-\d{2}$/.test(v)) v+="-01"; set(p,/aiFrom|\.from$/.test(p)?v:numish(p,v)); render(); });
  document.querySelectorAll("#v-xp .xpl").forEach(el=>el.onchange=()=>{ XP.lev[el.dataset.xl]=el.value; render(); });
  document.querySelectorAll("#v-xp .xpr").forEach(el=>el.onchange=()=>{ const [ix,k]=el.dataset.xr.split("."); const r=XP.rows[+ix]; let v=el.value.trim();
    if((k==="j"||k==="k")&&v!=="") v=+v; if(v===""&&k!=="n") delete r[k]; else r[k]=v; render(); });
  document.querySelectorAll("#v-xp [data-xo]").forEach(b=>b.onclick=()=>{ XPV.open[b.dataset.xo]=!XPV.open[b.dataset.xo]; render(); });
  document.querySelectorAll("#v-xp [data-xaux]").forEach(b=>b.onclick=()=>{ XPV.aux=!XPV.aux; render(); });
  document.querySelectorAll("#v-xp [data-xs]").forEach(b=>b.onclick=()=>{ XPV.slot[b.dataset.xs]=!XPV.slot[b.dataset.xs]; render(); });
  document.querySelectorAll("#v-xp [data-xtf]").forEach(b=>b.onclick=()=>{ XPV.team=b.dataset.xtf; render(); });
  if($("xpPlanT")) $("xpPlanT").onclick=()=>{ XPV.plan=!XPV.plan; render(); };
  if($("xpReset")) $("xpReset").onclick=()=>{ if(confirm("엑셀(v0.99) 값으로 처음부터 되돌릴까요? 모두에게 공유되는 값이 바뀌어요.")){ XP=clone(XP_SEED); render(); } };
  if($("xpCopy")) $("xpCopy").onclick=()=>{ const t=document.querySelector("#v-xp table.xpm"); const txt=[...t.rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/\s+/g," ").replace(/[▸▾]|팀별/g,"").trim()).join("\t")).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("월별 현황을 복사했어요 — 엑셀에 붙여넣기")).catch(()=>toast("복사하지 못했어요")); };
}

const DG_HTML="\n<div class=\"wrap\">\n\n  <nav class=\"toc\" aria-label=\"목차\">\n    <p>목차</p>\n    <ol>\n      <li><a href=\"#dg-summary\" data-dgj=\"dg-summary\">핵심 요약</a></li>\n      <li><a href=\"#dg-flow\" data-dgj=\"dg-flow\">납품 흐름과 담당</a></li>\n      <li><a href=\"#dg-common\" data-dgj=\"dg-common\">공통 오디오 기준</a></li>\n      <li><a href=\"#dg-sound\" data-dgj=\"dg-sound\">사운드 파일 (WAV)</a></li>\n      <li><a href=\"#dg-video\" data-dgj=\"dg-video\">영상 파일 (MP4)</a></li>\n      <li><a href=\"#dg-check\" data-dgj=\"dg-check\">납품 전 체크리스트</a></li>\n      <li><a href=\"#dg-why\" data-dgj=\"dg-why\">-14 LUFS로 정한 이유</a></li>\n    </ol>\n  </nav>\n\n  <main>\n    <header>\n      <h1>숏애니 영상·사운드 최종 납품 가이드</h1>\n      <dl class=\"meta\">\n        <dt>대상</dt><dd>숏애니 영상 제작(내부 제작팀·외부 제작사), 사운드(더빙·믹싱) 스튜디오</dd>\n        <dt>적용 범위</dt><dd>네이버웹툰 숏애니 전 작품의 최종 영상·사운드 납품</dd>\n        <dt>기준</dt><dd>VOD CLOUD 업로드·재생 사양</dd>\n      </dl>\n    </header>\n\n    <div class=\"dgup\"><div><b>납품 파일 업로드</b> <span>최종 사운드(WAV S-1~S-4)·영상(MP4 V-1)은 N드라이브 폴더에 올려요 · 내부팀 관리 기준</span></div><a class=\"dgupb\" href=\"https://ndrive.navercorp.com/drive/web/message/folder?resourceKey=QDMwMDAwMDAwMDAwMTU3Mjd8MzQ3MjYxMzc0MDgzOTY3MTA0OXxEfDM3MDAwMDAwMDAyNjA4NjQwMDA&resourceLocation=14101\" target=\"_blank\" rel=\"noopener\">N드라이브 업로드 폴더 열기 ↗</a></div>\n    <div class=\"meter\" role=\"img\" aria-label=\"라우드니스 기준: 납품 목표 -14 LUFS, 플랫폼 재생 기준 -16 LUFS, 방송 기준 -24 LKFS는 사용하지 않음. True Peak는 -2 dBTP 이하.\">\n      <h2>납품 라우드니스는 -14 LUFS입니다</h2>\n      <p>방송 기준(-24 LKFS)으로 만들지 마세요.</p>\n      <div class=\"scale\" aria-hidden=\"true\">\n        <div class=\"bar\"><div class=\"fill\"></div></div>\n        <div class=\"tick no down\" style=\"left:20%\"><span class=\"lbl\"><b>-24</b>방송 기준<br>사용 안 함</span></div>\n        <div class=\"tick platform down\" style=\"left:46.667%\"><span class=\"lbl\"><b>-16</b>플랫폼<br>재생 기준</span></div>\n        <div class=\"tick target up\" style=\"left:53.333%\"><span class=\"lbl\"><b>-14 LUFS</b>납품 목표</span></div>\n      </div>\n      <div class=\"axis\" aria-hidden=\"true\"><span>-30</span><span>-20</span><span>-10</span><span>0 LUFS</span></div>\n      <div class=\"peak\">\n        <span>True Peak</span>\n        <b>-2 dBTP 이하</b>\n        <span style=\"color:var(--muted)\">재인코딩 시 피크 상승을 감안해 일반 기준(-1 dBTP)보다 1dB 여유</span>\n      </div>\n    </div>\n\n    <section id=\"dg-summary\">\n      <h2>핵심 요약</h2>\n      <p>납품물은 <strong>사운드 파일(WAV)</strong>과 <strong>영상 파일(MP4)</strong> 두 종류로 나뉩니다.</p>\n      <div class=\"split\">\n        <div>\n          <h3>사운드 파일</h3>\n          <p class=\"fmt\">WAV 48kHz / 24bit</p>\n          <dl>\n            <dt>담당</dt><dd>사운드 스튜디오</dd>\n            <dt>용도</dt><dd>영상 합성용, 보관용 원본, 재편집·다국어 더빙 대응</dd>\n            <dt>구성</dt><dd>Full Mix + 대사/SE/BGM 스템</dd>\n            <dt>채널</dt><dd>스테레오</dd>\n            <dt>라우드니스</dt><dd>-14 LUFS (Full Mix 기준)</dd>\n            <dt>True Peak</dt><dd>-2 dBTP 이하</dd>\n          </dl>\n        </div>\n        <div>\n          <h3>영상 파일</h3>\n          <p class=\"fmt\">MP4 (H.264 + AAC-LC)</p>\n          <dl>\n            <dt>담당</dt><dd>영상 제작 (내부 제작팀·외부 제작사)</dd>\n            <dt>용도</dt><dd>플랫폼 업로드용 완성본</dd>\n            <dt>구성</dt><dd>영상 + Full Mix 오디오</dd>\n            <dt>해상도</dt><dd>1080P 1개 파일</dd>\n            <dt>채널</dt><dd>스테레오</dd>\n            <dt>라우드니스</dt><dd>-14 LUFS</dd>\n            <dt>True Peak</dt><dd>-2 dBTP 이하</dd>\n          </dl>\n        </div>\n      </div>\n    </section>\n\n    <section id=\"dg-flow\">\n      <h2>납품 흐름과 담당</h2>\n      <ol class=\"flow\">\n        <li><span class=\"who\">영상 제작</span><strong>사운드 작업용 영상을 사운드 스튜디오에 전달</strong></li>\n        <li><span class=\"who\">사운드 스튜디오</span><strong>사운드 파일(S-1~S-4) 납품</strong></li>\n        <li><span class=\"who\">영상 제작</span><strong>Full Mix(S-1)를 영상에 얹어 업로드용 MP4(V-1) 출력·납품</strong></li>\n      </ol>\n      <div class=\"callout info\">\n        <p>외부 제작사가 사운드까지 함께 맡는 경우에는 사운드 파일(S-1~S-4)과 영상 파일(V-1)을 모두 납품해 주세요.</p>\n      </div>\n    </section>\n\n    <section id=\"dg-common\">\n      <h2>공통 오디오 기준<small>사운드 파일과 영상 파일 모두에 적용</small></h2>\n\n      <h3>라우드니스 / 피크</h3>\n      <div class=\"table-scroll\">\n      <table>\n        <thead><tr><th>항목</th><th>기준</th><th>설명</th></tr></thead>\n        <tbody>\n          <tr><td>Integrated Loudness</td><td class=\"code\">-14 LUFS</td><td>ITU-R BS.1770 기준, 에피소드 전체 구간으로 측정</td></tr>\n          <tr><td>True Peak</td><td class=\"code\">-2 dBTP 이하</td><td>업로드 후 AAC 재인코딩 시 피크가 올라갈 수 있어 일반 기준(-1 dBTP)보다 1dB 여유</td></tr>\n        </tbody>\n      </table>\n      </div>\n      <div class=\"callout\">\n        <p>방송 기준(-24 LKFS)으로 만들면 웹과 iOS에서 다른 영상보다 작게 들립니다.</p>\n      </div>\n\n      <h3>채널</h3>\n      <ul class=\"notes\">\n        <li><strong>스테레오(2ch)로만 납품해 주세요.</strong></li>\n        <li>플랫폼은 최대 2ch까지만 인코딩·재생하며, 5.1ch는 지원하지 않습니다.</li>\n        <li>5.1ch로 작업한 경우에도 자동 다운믹스는 의도한 믹스와 달라질 수 있으므로, <strong>스테레오 마스터를 별도로 믹스해서</strong> 납품해 주세요.</li>\n      </ul>\n    </section>\n\n    <section id=\"dg-sound\">\n      <h2>사운드 파일 (WAV)<small>담당: 사운드 스튜디오</small></h2>\n\n      <h3>납품물</h3>\n      <p>화당(에피소드당) 아래 4개 파일을 납품해 주세요.</p>\n      <div class=\"table-scroll\">\n      <table>\n        <thead><tr><th>No.</th><th>파일</th><th>설명</th></tr></thead>\n        <tbody>\n          <tr><td class=\"code\">S-1</td><td>Full Mix 마스터</td><td>대사·SE·BGM이 모두 믹스된 최종 사운드</td></tr>\n          <tr><td class=\"code\">S-2</td><td>대사(Dialogue) 스템</td><td>대사만 분리</td></tr>\n          <tr><td class=\"code\">S-3</td><td>효과음(SE) 스템</td><td>효과음만 분리</td></tr>\n          <tr><td class=\"code\">S-4</td><td>배경음악(BGM) 스템</td><td>배경음악만 분리</td></tr>\n        </tbody>\n      </table>\n      </div>\n\n      <h3>사양</h3>\n      <div class=\"table-scroll\">\n      <table>\n        <tbody>\n          <tr><th scope=\"row\">포맷</th><td>WAV (PCM, 무압축)</td></tr>\n          <tr><th scope=\"row\">샘플레이트</th><td>48kHz</td></tr>\n          <tr><th scope=\"row\">비트 심도</th><td>24bit</td></tr>\n          <tr><th scope=\"row\">채널</th><td>스테레오</td></tr>\n        </tbody>\n      </table>\n      </div>\n\n      <h3>유의사항</h3>\n      <ul class=\"notes\">\n        <li>라우드니스 -14 LUFS / True Peak -2 dBTP 기준은 <strong>Full Mix(S-1)</strong>에 적용합니다.</li>\n        <li>스템(S-2~S-4)은 개별로 노멀라이즈하지 말고 Full Mix에 들어간 레벨 그대로 출력해 주세요.</li>\n        <li>대사 + SE + BGM 스템을 합치면 Full Mix(S-1)와 같아야 합니다.</li>\n        <li>4개 파일 모두 <strong>길이와 시작점이 동일</strong>해야 하며, 전달받은 영상과 프레임 단위로 싱크가 맞아야 합니다.</li>\n        <li>영상 프레임레이트는 작품 전체에서 동일하게 통일됩니다. 전달받은 영상의 프레임레이트 기준으로 작업해 주세요.</li>\n      </ul>\n    </section>\n\n    <section id=\"dg-video\">\n      <h2>영상 파일 (MP4)<small>담당: 영상 제작 (내부 제작팀·외부 제작사)</small></h2>\n\n      <h3>납품물</h3>\n      <div class=\"table-scroll\">\n      <table>\n        <thead><tr><th>No.</th><th>파일</th><th>설명</th></tr></thead>\n        <tbody>\n          <tr><td class=\"code\">V-1</td><td>업로드용 완성본</td><td>영상 + Full Mix(S-1) 오디오를 합친 1080P 최종본</td></tr>\n        </tbody>\n      </table>\n      </div>\n\n      <h3>해상도 납품 방침</h3>\n      <ul class=\"notes\">\n        <li><strong>1080P 파일 1개만 납품해 주세요.</strong> 서비스 최대 해상도 기준입니다.</li>\n        <li>서비스 화질 옵션은 1080P / 720P / 480P이며, 720P와 480P는 1080P 파일을 기준으로 제품 측에서 자동으로 만듭니다. 해상도별로 따로 납품할 필요는 없습니다.</li>\n        <li>4K는 현재 납품하지 않습니다. 추후 필요하면 마스터 파일 기준으로 업스케일링 작업을 별도 요청드립니다.</li>\n        <li>추후 작업에 대비해 원본 마스터 파일은 보관해 주세요.</li>\n      </ul>\n\n      <h3>비디오 사양</h3>\n      <div class=\"table-scroll\">\n      <table>\n        <tbody>\n          <tr><th scope=\"row\">컨테이너</th><td>MP4</td></tr>\n          <tr><th scope=\"row\">비디오 코덱</th><td>H.264</td></tr>\n          <tr><th scope=\"row\">해상도</th><td>1080P</td></tr>\n          <tr><th scope=\"row\">화면비</th><td class=\"tbd\">확정 필요</td></tr>\n          <tr><th scope=\"row\">프레임레이트</th><td class=\"tbd\">작품 전체 동일하게 통일<span style=\"display:block\">기준값은 제작팀 확정 후 공유 예정</span></td></tr>\n          <tr><th scope=\"row\">비디오 비트레이트</th><td class=\"tbd\">확정 필요</td></tr>\n        </tbody>\n      </table>\n      </div>\n\n      <h3>오디오 사양</h3>\n      <div class=\"table-scroll\">\n      <table>\n        <tbody>\n          <tr><th scope=\"row\">오디오 코덱</th><td>AAC-LC</td></tr>\n          <tr><th scope=\"row\">채널</th><td>스테레오</td></tr>\n          <tr><th scope=\"row\">샘플레이트</th><td>48kHz</td></tr>\n          <tr><th scope=\"row\">비트레이트</th><td>256~320kbps</td></tr>\n        </tbody>\n      </table>\n      </div>\n\n      <h3>사운드를 영상에 얹을 때 (프리미어 / 에프터이펙트)</h3>\n      <ul class=\"notes\">\n        <li>사운드 스튜디오에서 받은 <strong>Full Mix(S-1) WAV를 그대로</strong> 타임라인에 올려 주세요.</li>\n        <li>편집 툴에서 볼륨 조정, 리미터, 노멀라이즈 등 <strong>음량을 바꾸는 처리를 하지 마세요.</strong> -14 LUFS / -2 dBTP 기준이 틀어집니다.</li>\n        <li>Full Mix 시작점을 영상 첫 프레임에 맞추고, 끝까지 싱크가 맞는지 확인해 주세요.</li>\n        <li>출력(Export) 시 오디오를 위 오디오 사양(AAC-LC / 스테레오 / 48kHz / 256~320kbps)으로 설정해 주세요.</li>\n        <li>업로드 후 한 번 더 인코딩되는 것을 감안한 비트레이트입니다. 256kbps보다 낮게 출력하지 마세요.</li>\n        <li>출력한 MP4의 음량을 다시 측정해 -14 LUFS / -2 dBTP 이하인지 확인해 주세요.</li>\n      </ul>\n      <div class=\"callout\">\n        <p>24bit 무압축(PCM) 오디오가 들어간 영상은 업로드할 수 없습니다. MP4 안의 오디오는 반드시 AAC로 넣어 주세요.</p>\n      </div>\n    </section>\n\n    <section id=\"dg-check\" class=\"checklist\">\n      <h2>납품 전 체크리스트</h2>\n      <div class=\"progress\">\n        <span>확인 완료 <output id=\"dg-count\">0</output> / <span id=\"dg-total\">0</span></span>\n        <button type=\"button\" id=\"dg-reset\">체크 초기화</button>\n      </div>\n\n      <fieldset>\n        <legend>사운드 스튜디오: 사운드 파일 (WAV)</legend>\n        <label><input type=\"checkbox\"><span>Full Mix가 -14 LUFS, True Peak -2 dBTP 이하인가</span></label>\n        <label><input type=\"checkbox\"><span>스테레오(2ch)인가 (5.1ch 아님)</span></label>\n        <label><input type=\"checkbox\"><span>Full Mix + 대사·SE·BGM 스템, 총 4개 파일이 모두 있는가</span></label>\n        <label><input type=\"checkbox\"><span>48kHz / 24bit WAV인가</span></label>\n        <label><input type=\"checkbox\"><span>스템 합산 = Full Mix인가 (개별 노멀라이즈 안 함)</span></label>\n        <label><input type=\"checkbox\"><span>4개 파일의 길이·시작점이 같고 영상과 싱크가 맞는가</span></label>\n      </fieldset>\n\n      <fieldset>\n        <legend>영상 제작: 영상 파일 (MP4)</legend>\n        <label><input type=\"checkbox\"><span>Full Mix(S-1)를 음량 조정 없이 그대로 얹었는가</span></label>\n        <label><input type=\"checkbox\"><span>영상과 사운드 싱크가 처음부터 끝까지 맞는가</span></label>\n        <label><input type=\"checkbox\"><span>1080P 파일 1개인가 (해상도별 별도 파일 불필요)</span></label>\n        <label><input type=\"checkbox\"><span>프레임레이트가 작품 전체에서 동일한가</span></label>\n        <label><input type=\"checkbox\"><span>H.264 + AAC-LC MP4인가</span></label>\n        <label><input type=\"checkbox\"><span>오디오가 스테레오 / 48kHz / 256~320kbps인가</span></label>\n        <label><input type=\"checkbox\"><span>출력한 MP4가 -14 LUFS, True Peak -2 dBTP 이하인가</span></label>\n      </fieldset>\n    </section>\n\n    <section id=\"dg-why\">\n      <h2>-14 LUFS로 정한 이유</h2>\n      <p>VOD CLOUD는 모든 영상에 재생 시 <strong>-16 LUFS 기준 음량 자동 보정</strong>이 설정되어 있지만, 실제 보정은 플레이어가 하기 때문에 플랫폼마다 동작이 다릅니다.</p>\n      <div class=\"table-scroll\">\n      <table>\n        <thead><tr><th>플랫폼</th><th>음량 보정</th><th>-24로 만들면</th><th>-14로 만들면</th></tr></thead>\n        <tbody>\n          <tr><td>웹</td><td>큰 소리만 줄임 (작은 소리는 안 키움)</td><td><span class=\"bad\">-24 그대로 (작게 들림)</span></td><td>-16으로 맞춰짐</td></tr>\n          <tr><td>Android</td><td>큰 소리는 줄이고 작은 소리도 키움</td><td><span class=\"bad\">-16 쪽으로 올라갈 수 있음 (끝까지 맞춰지는지는 불확실)</span></td><td>-16으로 맞춰짐</td></tr>\n          <tr><td>iOS</td><td>현재 미적용 (원본 그대로 재생)</td><td><span class=\"bad\">-24 그대로 (작게 들림)</span></td><td>-14 그대로</td></tr>\n        </tbody>\n      </table>\n      </div>\n      <p>-14 LUFS로 만들면 플랫폼 간 차이가 약 2dB로 가장 작아집니다. 또 -14는 소리를 키울 필요 없이 줄이기만 하면 되기 때문에, 어느 플랫폼에서든 결과가 확실합니다.</p>\n      <div class=\"callout info\">\n        <p>iOS 미적용 여부는 iOS 앱팀에서 확인 예정이며, 결과에 따라 이 가이드가 업데이트될 수 있습니다.</p>\n      </div>\n    </section>\n\n    <footer>\n      <p>문의: AI Short Ani TF</p>\n    </footer>\n  </main>\n</div>\n\n\n";

/* ---------- 외주사 찾기 계산 (외부 일본 · 일본 외) ----------

   후속 시즌은 앞 시즌 제작사가 이어서(자리 있으면) · 새 작품은 들어갈 수 있는 곳 중 가장 오래전에 착수한 곳 · 없으면 새 제작사
   새 제작사 컨택 = 그 제작사 첫 착수에서 (샘플 계약 + 계약 논의 + 본계약·프리프로덕션) 주 전 */
function l3Vendors(S,rows){ const P=S.src||{}, cap=+P.cap||3, g2=+P.gap2||0, g3=+P.gap3||0, leadW=(+P.sample||0)+(+P.talk||0)+(+P.pre||0);
  const addM=(d,n)=>{ const x=new Date(d*86400000); return Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+n,x.getUTCDate())/86400000; };
  const out={}; ["외부 일본","외부 일본 외"].forEach(team=>{ const W=rows.filter(r=>r.team===team).sort((a,b)=>a.F-b.F||a.R-b.R||a.C-b.C), V=[], of=new Map();
    const fits=(v,r)=>{ const act=v.jobs.filter(j=>j.F<=r.N&&j.N>=r.F).length; if(act>=cap) return false; const n=v.jobs.length; if(n===1&&r.F<addM(v.first,g2)) return false; if(n>=2&&v.jobs.length<cap&&n===2&&r.F<addM(v.jobs[1].F,g3)) return false; return true; };
    W.forEach(r=>{ let v=null; if(r.C>1&&r.prev&&of.has(r.prev)){ const pv=of.get(r.prev); if(fits(pv,r)) v=pv; }
      if(!v){ const c=V.filter(x=>fits(x,r)); if(c.length) v=c.sort((a,b)=>a.last-b.last)[0]; }
      if(!v){ v={no:V.length+1,first:r.F,jobs:[],last:r.F}; V.push(v); }
      v.jobs.push(r); v.last=r.F; of.set(r,v); });

    out[team]={V,contact,firstS,cum,act,vAct,before:before.length}; });
  return out; }

function l3Bind(){ const v=$("v-plan");
  const setPath=(p,val)=>{ const ks=p.split("."); let o=L3; for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(o[k]==null) o[k]={}; o=o[k]; } const last=ks[ks.length-1]; if(Array.isArray(o)) o[+last]=val; else o[last]=val; };
  const parse=(p,raw)=>{ const t=String(raw).trim(); if(/^lev\.addFrom$|^cost\.rightsSwitch$/.test(p)) return t; if(t==="") return null; const x=+t.replace(/,/g,""); return isFinite(x)?x:t; };
  v.querySelectorAll(".l3i").forEach(el=>{ el.onchange=()=>{ setPath(el.dataset.l3,parse(el.dataset.l3,el.value)); render(); };
    el.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } };

  document.querySelectorAll("#v-lp [data-rng]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const [gi,pi]=b.dataset.rng.split(":").map(Number); const G=LP.cur.groups[gi], p=G.pipes[pi];
    const pop=vPopAt(b,`<h4>${esc(p.name)} · 구간 설정</h4><p class="ps">고른 달부터 끝까지 한 번에 바꿔요</p>
      <div class="row"><span>시작 달</span><select class="in" id="rgM">${LP2_M.map(m=>`<option value="${m}"${m===key(TODAY).slice(0,7)?" selected":""}>${m.slice(2,4)}.${+m.slice(5)}</option>`).join("")}</select></div>
      <div class="row"><span>영업일</span><input class="in n" id="rgB" type="number" min="3" max="15" placeholder="그대로"> <span class="hint" style="width:auto">일</span></div>
      <div class="row"><span>성우</span><select class="in" id="rgA"><option value="">그대로</option><option value="all">전부 AI 성우</option><option value="none">전부 인간 성우</option><option value="half">절반 AI (내림)</option></select></div>
      <div class="row"><span>적용 범위</span><select class="in" id="rgS"><option value="p">이 파이프라인</option><option value="g">${esc(G.id)} 전체</option><option value="all">모든 팀</option></select></div>
      <div class="acts"><button type="button" class="btn" id="rgX">닫기</button><button type="button" class="btn pri" id="rgOk">적용</button></div>`);
    $("rgX").onclick=closePop;
    $("rgOk").onclick=()=>{ const m0=$("rgM").value, bd=$("rgB").value, ai=$("rgA").value, sc=$("rgS").value; closePop();
      set(P=>{ const targets=sc==="p"?[P.groups[gi].pipes[pi]]:sc==="g"?P.groups[gi].pipes:P.groups.flatMap(x=>x.pipes);
        targets.forEach(q=>{ q.bd=q.bd||{}; q.aiN=q.aiN||{};
          if(bd!==""){ const v=Math.max(3,Math.min(15,+bd)); LP2_M.forEach(m=>{ if(m>m0) delete q.bd[m]; }); q.bd[m0]=v; }
          if(ai) LP2_M.forEach(m=>{ if(m<m0) return; const n=+((q.start||{})[m])||0; if(!n) return; q.aiN[m]=ai==="all"?n:ai==="none"?0:Math.floor(n/2); }); }); }); }; });
  if($("lpBase")) $("lpBase").onclick=()=>{ if(!confirm("엑셀 시뮬레이터 기본값(착수·영업일·AI·계산 방식)으로 되돌릴까요? 지금 값은 자동 보관돼요.")) return;
    lpOp({op:"hadd",v:{id:"h"+Date.now().toString(36),name:`엑셀 기본값으로 되돌리기 전 (${md(TODAY)})`,by:lpWho(),at:new Date().toISOString(),plan:clone(LP.cur)}});
    const seed=lp2Repack(lp2Seed()); seed.cost=LP.cur.cost; seed.aop2=1; seed.afv=1; seed.g={...seed.g,smooth:"plan",autoFit:LP.cur.g.autoFit!==false}; seed.lplan=LP.cur.lplan; seed.targets=clone(LP.cur.targets); lpOp({op:"cur",v:lp2AutoFit(seed)}); toast("엑셀 기본값으로 되돌렸어요"); render(); };
  if($("lpUndo")) $("lpUndo").onclick=(e)=>{ e.stopPropagation(); lpUndoMenu(e.currentTarget); };
  if($("lpHist")) $("lpHist").onclick=()=>{ LPV.showHist=!LPV.showHist; render(); };
  if($("lpSnap")) $("lpSnap").onclick=()=>{ const nm=prompt("기록 이름 (예: 10/15 리드 보고)",`${md(TODAY)} 기록`); if(!nm) return;
    lpOp({op:"hadd",v:{id:"h"+Date.now().toString(36),name:nm.trim(),by:lpWho(),at:new Date().toISOString(),plan:clone(LP.cur)}}); LPV.showHist=true; toast("기록을 남겼어요"); render(); };
  if($("lpBack")) $("lpBack").onclick=()=>{ LPV.peek=null; render(); };
  if($("lpRestore")) $("lpRestore").onclick=()=>{ const pk=LPV.peek; if(!confirm(`'${pk.name}'으로 현재 버전을 되돌릴까요? 지금 현재 버전은 기록으로 먼저 남겨둘게요.`)) return;
    lpOp({op:"hadd",v:{id:"h"+Date.now().toString(36),name:`되돌리기 전 자동 기록 (${md(TODAY)})`,by:lpWho(),at:new Date().toISOString(),plan:clone(LP.cur)}});
    lpOp({op:"cur",v:clone(pk.plan)}); LPV.peek=null; toast("현재 버전을 되돌렸어요"); render(); };
  document.querySelectorAll("#v-lp [data-hpeek]").forEach(b=>b.onclick=()=>{ const x=(LP.hist||[]).find(h=>h.id===b.dataset.hpeek); LPV.peek=x?{id:x.id,name:x.name,plan:x.plan}:null; render(); });
  document.querySelectorAll("#v-lp [data-hdel]").forEach(b=>b.onclick=()=>{ const x=(LP.hist||[]).find(h=>h.id===b.dataset.hdel); if(x&&confirm(`'${x.name}' 기록을 지울까요?`)){ if(LPV.peek&&LPV.peek.id===x.id) LPV.peek=null; lpOp({op:"hdel",id:x.id}); render(); } });
}

/* ---------- 탭 · 시작 ---------- */
function setTab(t){
  TAB=t; $("pop").hidden=true;
  render(); window.scrollTo(0,0);
  try{   // 미리보기·file:// 등 일부 환경은 주소 변경을 막으므로 실패해도 무시
    const u=new URL(location.href); u.searchParams.set("tab",t);
    if(t==="prod"&&SEL) u.searchParams.set("w",SEL); else u.searchParams.delete("w");
    history.replaceState(null,"",u.toString());
  }catch(e){}
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
document.querySelectorAll("#langSw [data-lang]").forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.lang!==LANG) setLang(b.dataset.lang); }));
document.querySelectorAll("#langSw [data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG)));
$("txSw").addEventListener("click",()=>{ TX_ON=!TX_ON; try{ localStorage.setItem("anime_autotx",TX_ON?"1":"0"); }catch(e){} render(); });
if(LANG==="ja"){ document.documentElement.lang="ja"; document.title="アニメ公開スケジュール"; }
TR_OBS.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["title","placeholder","aria-label"]});
(async function init(){
  try{ const q=new URLSearchParams(location.search);
    if(["open","prod","std","guide","plan","lp","lc","xp","sim","vendors","users"].includes(q.get("tab"))) TAB=q.get("tab");
    if(q.get("w")) SEL=q.get("w"); }catch(e){}
  if(!SB.on){
    WORKS=clone(DEFAULT_WORKS).map(normW); VENDORS=vApplyUpd1015(vActMigrate(clone(V_SEED)));
    setSync("off","공유 저장소 미설정 — 고친 내용이 이 창에만 남습니다");
    runMigrations(); render(); return;
  }
  if(AUTH_REQUIRED){ setSync("busy","로그인 확인 중…"); if(!(await authStart())) return; }
  setSync("busy","공유 저장소 불러오는 중…"); render();
  try{
    const r=await pullAll(true);
    if(r.empty){ WORKS=clone(DEFAULT_WORKS).map(normW); CONF=normConf(DEFAULT_CONF); setHol(CONF.hol); }
    await runMigrations();
    setSync("on",`공유 중 · ${hhmm()} 불러옴`);
  }catch(e){ console.error("Supabase 연결 오류:",e); if(!WORKS.length) WORKS=clone(DEFAULT_WORKS).map(normW); const [t,tip]=errMsg(e); setSync("err",`공유 저장소 연결 실패 — ${t}`,tip); }
  render();
  const tick=async()=>{ try{ const r=await pullAll(false); if(r.changed) safeRender(); if(!Object.values(PENDING).some(a=>a.length)) setSync("on",`공유 중 · ${hhmm()} 확인`);}catch(e){ const [t,tip]=errMsg(e); setSync("err",`공유 저장소 연결 끊김 — ${t}`,tip); } };
  setInterval(tick,POLL_MS);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });
})();
</script>
